# Thème de base : le design final est appliqué par assets/style.css
[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#07071A"
secondaryBackgroundColor = "#0F1030"
textColor = "#E6E6F5"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
runOnSave = true
