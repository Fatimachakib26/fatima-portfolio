<title>Crédit Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>/* Crédit Horizon · Risk Intelligence — apparence « logiciel de gestion »
   Fenêtre applicative : barre de titre, barre de menus, navigateur en arborescence, espace de travail,
   barre d'état. Grilles de données à bordures, panneaux à en-tête, contrôles compacts. */
:root {
  --chrome: #0e3b2e; --chrome-2: #135140; --chrome-ink: #e8f2ee; --chrome-dim: #9cc4b5;
  --menubar: #f4f6f5; --toolbar: #fafbfb; --work: #e6ebe9; --surface: #ffffff; --surface-2: #f4f6f5; --head: #eef2f0;
  --line: #c9d3cf; --line-2: #e1e7e4; --ink: #17241f; --ink-2: #44544e; --ink-3: #75847e;
  --brand: #0f6b50; --brand-2: #0c5a43; --brand-soft: #d6ece3; --on-brand: #ffffff; --select: #cfe7dc; --hover: #eef5f2;
  --ok: #1b7044; --ok-soft: #e2f1e8; --warn: #95570a; --warn-soft: #fbf0da; --bad: #b0281f; --bad-soft: #fbe6e3; --info: #1d5b98; --info-soft: #e2ecf7; --mute: #5d6b66; --mute-soft: #edf1ef;
  --l-low: #2c8653; --l-mid: #b08a0b; --l-high: #cf601d; --l-crit: #bb3027;
  --c-low: #dff0e5; --c-mid: #f6eecb; --c-high: #f9dfcc; --c-crit: #f5d4cf;
  --sans: "Segoe UI", "IBM Plex Sans", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Mono", "IBM Plex Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #0a1f18; --chrome-2: #10291f; --chrome-ink: #dfece6; --chrome-dim: #84a99b;
    --menubar: #151d1a; --toolbar: #182220; --work: #0f1513; --surface: #161f1c; --surface-2: #1b2522; --head: #1d2925;
    --line: #2f3e38; --line-2: #24312c; --ink: #e2ebe7; --ink-2: #a8b8b1; --ink-3: #7b8c85;
    --brand: #43b088; --brand-2: #58c49c; --brand-soft: #173a2e; --on-brand: #04120d; --select: #1f4436; --hover: #1d2b26;
    --ok: #5cc28c; --ok-soft: #14301f; --warn: #e2a64a; --warn-soft: #33260f; --bad: #f07a6f; --bad-soft: #3a1a17; --info: #78aee8; --info-soft: #16263a; --mute: #9aaba4; --mute-soft: #1c2924;
    --l-low: #4cb37a; --l-mid: #d6ae2e; --l-high: #ec8443; --l-crit: #ec6a5f;
    --c-low: #15301f; --c-mid: #33300f; --c-high: #3a2414; --c-crit: #3d1916;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #0a1f18; --chrome-2: #10291f; --chrome-ink: #dfece6; --chrome-dim: #84a99b;
  --menubar: #151d1a; --toolbar: #182220; --work: #0f1513; --surface: #161f1c; --surface-2: #1b2522; --head: #1d2925;
  --line: #2f3e38; --line-2: #24312c; --ink: #e2ebe7; --ink-2: #a8b8b1; --ink-3: #7b8c85;
  --brand: #43b088; --brand-2: #58c49c; --brand-soft: #173a2e; --on-brand: #04120d; --select: #1f4436; --hover: #1d2b26;
  --ok: #5cc28c; --ok-soft: #14301f; --warn: #e2a64a; --warn-soft: #33260f; --bad: #f07a6f; --bad-soft: #3a1a17; --info: #78aee8; --info-soft: #16263a; --mute: #9aaba4; --mute-soft: #1c2924;
  --l-low: #4cb37a; --l-mid: #d6ae2e; --l-high: #ec8443; --l-crit: #ec6a5f;
  --c-low: #15301f; --c-mid: #33300f; --c-high: #3a2414; --c-crit: #3d1916;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--work); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; color: var(--ink); }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
small { color: var(--ink-3); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--surface-2); color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

/* ---------- fenêtre ---------- */
#app { height: 100%; }
.boot { height: 100%; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--ink-3); }
.mark { width: 22px; height: 22px; flex: none; }
.mark rect { fill: #1d8a66; }
.mark path { stroke: #ffffff; }
.boot .mark { width: 44px; height: 44px; }
.win { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }
.titlebar { display: flex; align-items: center; gap: 9px; background: var(--chrome); color: var(--chrome-ink); padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
.titlebar b { font-weight: 600; font-size: 13.5px; letter-spacing: .01em; }
.tb-sub { color: var(--chrome-dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-user { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--chrome-dim); white-space: nowrap; }
.tb-user .av { width: 22px; height: 22px; border-radius: 50%; background: var(--chrome-2); color: var(--chrome-ink); display: grid; place-items: center; font-size: 10.5px; font-weight: 600; }
.tb-menu { display: none; background: none; border: 0; color: var(--chrome-ink); padding: 2px; cursor: pointer; }
.menubar { display: flex; gap: 0; background: var(--menubar); border-bottom: 1px solid var(--line); padding: 0 6px; position: relative; z-index: 30; }
.mnu { position: relative; }
.mnu summary { list-style: none; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink); border-radius: 3px; margin: 2px 0; user-select: none; }
.mnu summary::-webkit-details-marker { display: none; }
.mnu summary:hover, .mnu[open] summary { background: var(--select); }
.mnu-l { position: absolute; left: 0; top: 100%; min-width: 270px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0, 0, 0, .16); padding: 4px; border-radius: 3px; z-index: 50; }
.mnu-l button { display: flex; width: 100%; justify-content: space-between; gap: 20px; align-items: center; background: none; border: 0; padding: 6px 12px; text-align: left; cursor: pointer; border-radius: 2px; font-size: 13px; }
.mnu-l button:hover, .mnu-l button:focus-visible { background: var(--brand); color: var(--on-brand); outline: none; }
.mnu-l button:hover kbd { background: transparent; color: inherit; border-color: currentColor; }
.mnu-l hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 6px; }
.body { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 0; }
.side { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; padding: 8px 0; }
.tg { margin-bottom: 4px; }
.tg-h { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 8px 14px 4px; }
.tg-h::before { content: "▾ "; font-size: 9px; }
.side a { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 22px; color: var(--ink); text-decoration: none; font-size: 13px; border-left: 3px solid transparent; }
.side a .ic { color: var(--ink-3); }
.side a:hover { background: var(--hover); }
.side a.on { background: var(--select); border-left-color: var(--brand); font-weight: 600; }
.side a.on .ic { color: var(--brand); }
.side a span { flex: 1; }
.side a em { font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--bad); color: #fff; border-radius: 3px; padding: 0 5px; }
.side-foot { margin-top: auto; padding: 12px 14px; font-size: 11px; color: var(--ink-3); border-top: 1px solid var(--line-2); }
main { overflow-y: auto; padding: 0 16px 18px; outline: none; min-width: 0; }
.statusbar { display: flex; gap: 0; background: var(--chrome); color: var(--chrome-dim); font-size: 11.5px; padding-bottom: env(safe-area-inset-bottom, 0px); overflow-x: auto; white-space: nowrap; }
.statusbar > span { padding: 4px 12px; border-right: 1px solid rgba(255, 255, 255, .1); }
.statusbar .sb-ok { color: var(--chrome-ink); }
.statusbar .sb-ok::before { content: "● "; color: #4ade80; }
.statusbar .sb-demo { color: #fcd34d; }
.statusbar .sb-r { margin-left: auto; border-left: 1px solid rgba(255, 255, 255, .1); }
.statusbar .sb-sync.on::before { content: "⟳ "; }
.icon-btn { background: none; border: 1px solid transparent; padding: 4px; border-radius: 3px; cursor: pointer; color: var(--ink-2); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); border-color: var(--line); }

/* ---------- barre d'outils de l'écran ---------- */
.ph { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 -16px 12px; padding: 8px 16px; background: var(--toolbar); border-bottom: 1px solid var(--line); }
.ph h1 { font-size: 16px; font-weight: 600; }
.lead { margin: 1px 0 0; color: var(--ink-3); font-size: 12px; max-width: 110ch; }
.eyebrow { margin: 0 0 2px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.ph-a { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; background: var(--surface); color: var(--ink); text-decoration: none; white-space: nowrap; line-height: 1.4; }
.btn:hover { background: var(--hover); border-color: var(--ink-3); }
.btn:active { background: var(--select); }
.btn .ic { width: 14px; height: 14px; }
.btn.primary { background: var(--brand); border-color: var(--brand-2); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-2); }
.btn.ghost { background: var(--surface); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-t { color: var(--bad); }
.btn.sm { padding: 1px 7px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link, .more { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; text-decoration: underline; font-size: 12px; }
.lk { color: var(--ink); text-decoration: none; }
.lk:hover { color: var(--brand); text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 4px 11px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--select); color: var(--ink); font-weight: 600; }
.seg.sm button { padding: 2px 9px; font-size: 12px; }
.seg.sm button.on.oui { background: var(--ok); color: #fff; }
.seg.sm button.on.non { background: var(--bad); color: #fff; }
.seg.sm button.on.na { background: var(--mute); color: var(--surface); }

/* ---------- panneaux (cadres à en-tête) ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 0 12px 12px; margin-bottom: 12px; min-width: 0; }
.panel > :not(.panel-h):first-child { margin-top: 12px; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 -12px 10px; padding: 6px 12px; background: var(--head); border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 12.5px; font-weight: 700; }
.panel-h p { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-3); }
.grid { display: grid; gap: 12px; }
.grid > * { min-width: 0; }
.grid.top { align-items: start; }
.g-7-5 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.g-1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-1-1-1 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid .panel { margin-bottom: 0; }
.grid + .grid, .grid + .panel, .panel + .grid, .metrics + .grid, .note + .grid, .metrics + .panel { margin-top: 12px; }
.small { font-size: 12px; color: var(--ink-3); margin: 6px 0 0; }

/* ---------- indicateurs ---------- */
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.metrics.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metric { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 3px; padding: 8px 12px 9px; }
.metric span { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.metric strong { display: block; font-size: 22px; font-weight: 600; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }
.metric strong em { font-style: normal; font-size: 13px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.metric small { display: block; font-size: 11.5px; }
.metric.bad { border-top-color: var(--bad); } .metric.bad strong { color: var(--bad); }
.metric.warn { border-top-color: var(--warn); } .metric.warn strong { color: var(--warn); }

/* ---------- grilles de données ---------- */
.tw { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-2); padding: 5px 8px; background: var(--head); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-2); white-space: nowrap; position: sticky; top: 0; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); vertical-align: top; }
th:last-child, td:last-child { border-right: 0; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
tr:last-child td { border-bottom: 0; }
td small { display: block; margin-top: 1px; font-size: 11.5px; }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.center th:not(:first-child), table.center td:not(:first-child) { text-align: center; }
table.hover tr.row { cursor: default; }
table.hover tr.row:hover td { background: var(--hover); }
table.hover tr.row.on td { background: var(--select); }
td.ids, .ids { white-space: nowrap; }
.mcell { display: flex; align-items: center; gap: 6px; }
.mcell span { font-variant-numeric: tabular-nums; min-width: 48px; }
.empty { padding: 22px 8px; text-align: center; color: var(--ink-3); display: grid; justify-items: center; gap: 10px; border: 1px dashed var(--line); background: var(--surface-2); }
.empty p { margin: 0; max-width: 60ch; }
.empty b { color: var(--ink); }
.toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.toolbar input { flex: 1; min-width: 200px; }
.toolbar select { width: auto; }
.count { font-size: 11.5px; color: var(--ink-3); }

/* ---------- marqueurs ---------- */
.ref { display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; margin-right: 3px; line-height: 1.5; }
.tag { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 2px; padding: 0 6px; background: var(--surface-2); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--mute); background: var(--mute-soft); padding: 0 6px; border-radius: 2px; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--ok); background: var(--ok-soft); } .st.info { color: var(--info); background: var(--info-soft); } .st.warn { color: var(--warn); background: var(--warn-soft); } .st.bad { color: var(--bad); background: var(--bad-soft); }
.lvl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; padding: 0 6px 0 0; }
.lvl i { width: 10px; height: 10px; border-radius: 2px; }
.lvl b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--ink-2); margin-left: 2px; }
.lvl.low { color: var(--l-low); } .lvl.low i { background: var(--l-low); }
.lvl.mid { color: var(--l-mid); } .lvl.mid i { background: var(--l-mid); }
.lvl.high { color: var(--l-high); } .lvl.high i { background: var(--l-high); }
.lvl.crit { color: var(--l-crit); } .lvl.crit i { background: var(--l-crit); }
.prio { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 0 5px; border-radius: 2px; }
.prio.p1 { background: var(--bad-soft); color: var(--bad); } .prio.p2 { background: var(--warn-soft); color: var(--warn); } .prio.p3 { background: var(--mute-soft); color: var(--mute); }
.meter { display: inline-block; width: 100%; max-width: 110px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--brand); }
.meter.bad i { background: var(--l-crit); } .meter.ok i { background: var(--ok); }
.dot-on { color: var(--brand); font-size: 11px; }
.mute-t { color: var(--ink-3); } .ok-t { color: var(--ok) !important; } .bad-t { color: var(--bad) !important; }
.note { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-left: 4px solid var(--info); background: var(--surface); border-radius: 2px; padding: 7px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink-2); }
.note .ic { width: 15px; height: 15px; margin-top: 1px; }
.note.lock { border-left-color: var(--mute); }
.note.ok { border-left-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.note.bad { border-left-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

/* ---------- graphiques ---------- */
.cols { display: flex; gap: 4px; align-items: stretch; height: 170px; padding: 4px 0 0; border-left: 1px solid var(--line); background: repeating-linear-gradient(0deg, transparent 0 33px, var(--line-2) 33px 34px); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.col .v { font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.col .bar { flex: 1; width: 100%; max-width: 36px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--ink-3); }
.col .bar i { display: block; width: 100%; background: var(--brand); min-height: 2px; }
.col.muted .bar i { background: color-mix(in srgb, var(--brand) 40%, var(--surface)); }
.col .l { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }

.mx { display: flex; gap: 6px; }
.mx-yl { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.mx-g { flex: 1; display: grid; grid-template-columns: 100px repeat(5, minmax(0, 1fr)); gap: 2px; }
.mx.compact .mx-g { grid-template-columns: 16px repeat(5, minmax(0, 1fr)); }
.mx-ax { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-align: right; padding-right: 4px; }
.mx-ax.x { align-items: center; text-align: center; padding: 3px 0 0; }
.mx-ax small { font-weight: 400; font-size: 10.5px; }
.mx-c { position: relative; min-height: 66px; border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); padding: 4px; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; }
.mx.compact .mx-c { min-height: 36px; padding: 3px; }
.mx-c.low { background: var(--c-low); } .mx-c.mid { background: var(--c-mid); } .mx-c.high { background: var(--c-high); } .mx-c.crit { background: var(--c-crit); }
.mx-c em { position: absolute; right: 4px; bottom: 2px; font-style: normal; font-size: 10px; color: var(--ink-3); }
.mx-r { font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; cursor: pointer; }
.mx-r:hover, .mx-r.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.mx-xl { text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }

/* ---------- vue d'ensemble ---------- */
.todo { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); }
.todo li a { display: grid; grid-template-columns: 220px 1fr; gap: 10px; padding: 6px 10px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line-2); border-left: 4px solid var(--line); }
.todo li:last-child a { border-bottom: 0; }
.todo li.bad a { border-left-color: var(--bad); } .todo li.warn a { border-left-color: var(--warn); }
.todo li a:hover { background: var(--hover); }
.todo b { font-weight: 600; }
.todo span { font-size: 12px; color: var(--ink-2); }

/* ---------- fiche risque ---------- */
.detail h2 { font-size: 13.5px; }
.score-line { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
.treat { margin: 8px 0 10px; padding: 6px 10px; border-left: 3px solid var(--brand); background: var(--surface-2); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 0; margin: 0; font-size: 12.5px; border: 1px solid var(--line-2); }
.kv dt { color: var(--ink-2); font-size: 12px; font-weight: 600; background: var(--surface-2); padding: 5px 8px; border-bottom: 1px solid var(--line-2); }
.kv dd { margin: 0; padding: 5px 8px; border-bottom: 1px solid var(--line-2); }
.kv.stack { grid-template-columns: 130px 1fr; }
.kv.two { grid-template-columns: 170px 1fr; }
.kv.compact { grid-template-columns: 1fr auto; font-size: 12px; }
.kv.compact dt { font-weight: 500; }
.kv.compact dd { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.li { margin-bottom: 2px; }
.dlg-a { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
.dlg-a.left { justify-content: flex-start; }
.hash { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

/* ---------- formulaires ---------- */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.form.f3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form.f4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
.fld label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 2px; }
.fld label i { color: var(--bad); font-style: normal; }
.fld small { display: block; font-size: 11px; margin-top: 2px; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 4px 7px; font-size: 13px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
textarea { min-height: 70px; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-2); }
.range { display: flex; align-items: center; gap: 8px; }
.range input { padding: 0; border: 0; box-shadow: none; accent-color: var(--brand); }
.range output { font-family: var(--mono); font-weight: 700; min-width: 24px; }
.chk { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.chk:last-child { border-bottom: 0; }
.chk small { display: block; font-size: 11px; }
.sticky { position: sticky; top: 56px; }
.analysis h2 { font-size: 13.5px; }
.analysis h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 12px 0 4px; }
.analysis h3 span { font-weight: 500; color: var(--ink-3); text-transform: none; margin-left: 4px; }
.verdict { padding: 7px 10px; font-size: 12.5px; border-left: 4px solid; }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.comp { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.comp .meter { max-width: none; flex: 1; }
.comp b { font-variant-numeric: tabular-nums; }
.find { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.find li { padding: 3px 0 3px 13px; position: relative; }
.find li::before { content: ""; position: absolute; left: 0; top: 9px; width: 7px; height: 7px; background: var(--info); }
.find li.alerte::before { background: var(--bad); } .find li.attention::before { background: var(--warn); }

/* ---------- contrôle interne ---------- */
.sheet { border-top: 1px solid var(--line-2); }
.sheet:first-of-type { border-top: 0; }
.sheet summary { display: flex; align-items: center; gap: 8px; padding: 7px 4px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.sheet summary:hover { background: var(--hover); }
.sheet summary::-webkit-details-marker { display: none; }
.sheet summary::before { content: "▸"; color: var(--ink-3); font-size: 11px; }
.sheet[open] summary::before { content: "▾"; }
.sheet .kv { margin: 2px 0 12px; }
.coso-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.coso { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
.coso h3 { font-size: 12.5px; font-weight: 600; min-height: 2.6em; }
.coso .comp { margin-top: 6px; }
td select { min-width: 126px; padding: 2px 6px; font-size: 12px; }

/* ---------- plan d'action ---------- */
.chains { display: grid; gap: 8px; }
.chain { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
.chain header { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--head); border-bottom: 1px solid var(--line); }
.chain header .btn { margin-left: auto; }
.chain ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.chain li { padding: 8px 10px; border-left: 1px solid var(--line-2); font-size: 12px; position: relative; }
.chain li:first-child { border-left: 0; }
.chain li:not(:last-child)::after { content: "›"; position: absolute; right: -6px; top: 6px; color: var(--brand); font-weight: 700; background: var(--surface); }
.chain li span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--brand); font-weight: 700; margin-bottom: 2px; }
.chain li p { margin: 0; }

/* ---------- référentiel ---------- */
.zone { border-top: 4px solid var(--l-low); padding-top: 10px; }
.zone.renforcee { border-top-color: var(--l-high); }
.zone.inacceptable { border-top-color: var(--l-crit); }
.zone h2 { font-size: 13.5px; margin-bottom: 4px; }
.zone ul { padding-left: 18px; font-size: 12px; margin: 8px 0; }
.zone .zr { border-top: 1px solid var(--line-2); padding-top: 6px; }
.plain { margin: 0; padding-left: 18px; }
.plain li { margin: 3px 0; }
.esc { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.esc > span { font-family: var(--mono); font-weight: 700; font-size: 11.5px; border-radius: 2px; padding: 1px 6px; height: fit-content; }
.esc .n1 { background: var(--mute-soft); color: var(--mute); } .esc .n2 { background: var(--warn-soft); color: var(--warn); } .esc .n3 { background: var(--bad-soft); color: var(--bad); }
.esc .small { margin-top: 1px; }
table.raci th:not(:first-child), table.raci td:not(:first-child) { text-align: center; }
table.raci th { white-space: normal; min-width: 88px; }
.rc { display: inline-block; min-width: 28px; font-family: var(--mono); font-size: 11.5px; font-weight: 700; border-radius: 2px; padding: 0 4px; }
.rc.rR { background: var(--brand-soft); color: var(--brand); }
.rc.rA, .rc.rAR { background: var(--brand); color: var(--on-brand); }
.rc.rC { background: var(--info-soft); color: var(--info); }
.rc.rI { color: var(--ink-2); }
.rc.rn { color: var(--line); }

/* ---------- portefeuille ---------- */
.insights { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line-2); }
.insights li { display: grid; grid-template-columns: 90px 1fr; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }
.insights p { margin: 0; font-size: 12.5px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: 1px 8px; padding: 5px 0; border-bottom: 1px solid var(--line-2); }
.steps li::before { content: counter(s); grid-row: span 2; width: 20px; height: 20px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 11px; font-weight: 700; border-radius: 2px; }
.steps span { font-size: 12px; color: var(--ink-2); }
.recon { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 4px 0 12px; flex-wrap: wrap; }
.recon div { text-align: center; border: 1px solid var(--line); padding: 6px 14px; background: var(--surface-2); }
.recon strong { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.recon span { font-size: 11.5px; color: var(--ink-3); }
.recon > b { font-size: 18px; color: var(--ink-3); font-weight: 400; }

/* ---------- assistant ---------- */
.advisor { display: grid; gap: 8px; }
.chat { background: var(--surface); border: 1px solid var(--line); padding: 14px; min-height: 340px; max-height: 62vh; overflow-y: auto; }
.starter { display: grid; gap: 10px; }
.prompts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.prompts button { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; cursor: pointer; display: grid; gap: 3px; }
.prompts button:hover { border-color: var(--brand); background: var(--hover); }
.prompts b { font-weight: 600; font-size: 12.5px; }
.prompts span { font-size: 11.5px; color: var(--ink-3); }
.msg { margin-bottom: 12px; max-width: 920px; }
.msg.user { margin-left: auto; width: fit-content; max-width: 75%; background: var(--brand); color: var(--on-brand); border-radius: 3px; padding: 7px 12px; }
.msg.assistant { border: 1px solid var(--line-2); border-left: 3px solid var(--brand); padding: 6px 12px; background: var(--surface); }
.md h2, .md h3, .md h4 { margin: 10px 0 4px; font-size: 13.5px; }
.md p { margin: 5px 0; }
.md ul, .md ol { padding-left: 20px; margin: 5px 0; }
.md li.sub { list-style: circle; margin-left: 14px; }
.md table { margin: 6px 0; font-size: 12px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 7px; white-space: normal; position: static; }
.md blockquote { margin: 6px 0; padding: 5px 10px; border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--warn); }
.md code { font-family: var(--mono); font-size: 12px; }
.ask { display: flex; gap: 6px; align-items: flex-end; }
.ask textarea { min-height: 36px; max-height: 150px; resize: none; }

/* ---------- administration ---------- */
.exports { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.exp { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.exp:hover { border-color: var(--brand); background: var(--hover); }
.exp span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.people { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line-2); }
.people li { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--line-2); }

/* ---------- onglets, fenêtres, notifications ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { background: var(--surface-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--surface); color: var(--ink); font-weight: 600; border-top: 2px solid var(--brand); }
.tabs button span { font-size: 11px; color: var(--ink-3); margin-left: 5px; }
#modal { display: none; }
#modal.open { display: block; }
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 12, .4); z-index: 60; }
.dlg { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 16px 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .3); }
.dlg.small { width: min(460px, calc(100vw - 24px)); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; margin: 0 -16px 12px; padding: 7px 10px 7px 16px; background: var(--chrome); color: var(--chrome-ink); position: sticky; top: 0; }
.dlg-h h3 { font-size: 13px; color: var(--chrome-ink); font-weight: 600; }
.dlg-h .icon-btn { color: var(--chrome-ink); }
.dlg-h .icon-btn:hover { background: rgba(255, 255, 255, .12); border-color: transparent; }
.dlg table td { border-right: 0; }
.err { color: var(--bad); font-size: 12.5px; margin: 0; min-height: 1px; }
.toast { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); background: var(--chrome); color: var(--chrome-ink); border-left: 4px solid #4ade80; padding: 8px 14px; border-radius: 3px; font-size: 12.5px; opacity: 0; transform: translateY(6px); transition: .18s; z-index: 70; pointer-events: none; max-width: 380px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast.show { opacity: 1; transform: none; }
.toast.bad { border-left-color: #f87171; }

/* ---------- adaptatif ---------- */
@media (max-width: 1180px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metrics .metric:nth-child(5):last-child { grid-column: span 2; }
  .coso-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .prompts, .exports { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chain ol { grid-template-columns: 1fr; }
  .chain li { border-left: 0; border-top: 1px solid var(--line-2); }
  .chain li::after { display: none; }
}
@media (max-width: 980px) {
  .g-7-5, .g-1-1, .g-1-1-1, .insights { grid-template-columns: 1fr; }
  .sticky { position: static; }
  .form.f3, .form.f4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .todo li a { grid-template-columns: 1fr; gap: 0; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  .win { min-height: 100vh; }
  .body { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 45; top: 0; bottom: 0; left: 0; width: 260px; transform: translateX(-100%); transition: transform .18s; box-shadow: 0 0 40px rgba(0, 0, 0, .25); padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  body.nav-open .side { transform: none; }
  .tb-menu { display: inline-grid; }
  .tb-sub, .tb-user { display: none; }
  .titlebar { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .menubar { overflow-x: auto; }
  .mnu-l { position: fixed; left: 8px; right: 8px; top: 72px; min-width: 0; }
  main { padding: 0 max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); overflow: visible; }
  .ph { margin: 0 -12px 10px; padding: 8px 12px; }
  .metrics, .metrics.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics .metric:nth-child(5):last-child { grid-column: 1 / -1; }
  .coso-row { grid-template-columns: 1fr 1fr; }
  .form, .form.f3, .form.f4, .prompts, .exports { grid-template-columns: 1fr; }
  .kv, .kv.two, .kv.stack { grid-template-columns: 1fr; }
  .mx-g { grid-template-columns: 20px repeat(5, minmax(0, 1fr)); }
  .mx-ax small { display: none; }
  .insights li { grid-template-columns: 1fr; gap: 4px; }
  .statusbar .sb-r, .statusbar > span:nth-child(2) { display: none; }
  .msg.user { max-width: 90%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .titlebar, .menubar, .side, .statusbar, .ph-a, .tabs, .btn { display: none !important; } .body { display: block; } main { overflow: visible; } .panel { break-inside: avoid; } }

<script>"use strict";(()=>{var Le={risks:[{id:"R01",title:"Octroi sur dossier incomplet ou incohérent",category:"Crédit",event:"Un crédit est autorisé et décaissé alors que des pièces obligatoires manquent ou que les informations du dossier se contredisent (identité, activité, revenus, garanties).",causes:"Directes : pièces incomplètes (fait du cas) ; informations incohérentes (fait du cas). Indirectes : pression sur les délais ; absence de liste de pièces obligatoires opposable (hypothèse à vérifier).",consequences:"Pertes sur créances ; impossibilité de mobiliser des garanties ; difficulté de recouvrement ; observations de l'audit ou du superviseur ; atteinte à la réputation.",probability:5,gravity:3,justification:"P=5 : le défaut de complétude figure parmi les faits du cas, il est donc déjà observé. G=3 : impact limité par dossier mais cumulatif ; il devient plus lourd si les dossiers concernés sont de montant élevé (à vérifier).",owner:"Directeur des risques (contrôle) ; Directeur commercial (constitution)",control_ids:"C01, C04",coso_principles:"P10, P12, P13",basis:"Constat",recommendation:"Checklist obligatoire des pièces ; blocage du dossier tant qu'une pièce obligatoire manque ; conservation de la preuve du contrôle (C01)."},{id:"R02",title:"Décisions d'octroi selon des critères non harmonisés",category:"Crédit",event:"Des dossiers comparables reçoivent des décisions différentes selon le décideur ou l'agence, sans grille commune d'acceptation.",causes:"Directes : critères non harmonisés (fait du cas). Indirectes : politique de crédit non formalisée ou non diffusée ; absence de comité de crédit structuré (hypothèse à vérifier).",consequences:"Sélection adverse ; portefeuille hétérogène et difficile à piloter ; contestations de clients ; impossibilité d'expliquer une décision à l'audit.",probability:4,gravity:3,justification:"P=4 : l'hétérogénéité est un fait du cas, mais sa fréquence exacte est inconnue. G=3 : effet progressif sur la qualité du portefeuille, sans choc immédiat.",owner:"Directeur général (politique) ; Directeur des risques (grille d'analyse)",control_ids:"C02, C06",coso_principles:"P7, P10, P12",basis:"Constat",recommendation:"Grille d'analyse commune et critères documentés ; revue indépendante des décisions dérogatoires (C02, C06)."},{id:"R03",title:"Dégradation du portefeuille sous pression des volumes",category:"Crédit",event:"Des objectifs de production fondés sur le volume conduisent à accepter des dossiers plus risqués ; la qualité du portefeuille se dégrade avec un décalage dans le temps.",causes:"Directes : objectifs de volumes en tension avec la qualité (fait du cas). Indirectes : rémunération ou évaluation des commerciaux sans composante qualité (hypothèse à vérifier) ; croissance sans suivi de la répartition des expositions (hypothèse à vérifier) ; arbitrage direction non formalisé.",consequences:"Hausse des impayés à moyen terme ; provisions et pertes ; tension sur la rentabilité ; effet de levier négatif sur la croissance recherchée.",probability:4,gravity:5,justification:"P=4 : la tension volume/qualité est un fait du cas et les incitations jouent dans le sens du volume. G=5 : atteinte potentielle à la viabilité de la stratégie de croissance et à la liquidité par effet de cascade.",owner:"Directeur général",control_ids:"C02, C03, C06, C07",coso_principles:"P5, P6",basis:"Constat",recommendation:"Intégrer un critère de qualité aux objectifs commerciaux ; revue trimestrielle ; suivi de la concentration (C06, C07)."},{id:"R04",title:"Retards de remboursement détectés tardivement",category:"Crédit",event:"Des échéances impayées ne sont pas repérées ou escaladées à temps ; le traitement amiable intervient trop tard.",causes:"Directes : suivi des anomalies insuffisamment formalisé (fait du cas), pouvant retarder la détection des échéances impayées. Indirectes : absence de calendrier d'alertes ; responsabilités de relance mal réparties (hypothèses à vérifier).",consequences:"Hausse des créances en souffrance ; coûts de recouvrement ; moindre efficacité des garanties ; tension de trésorerie.",probability:3,gravity:3,justification:"P=3 : le cas établit un suivi des anomalies insuffisamment formalisé, indice indirect de faiblesse du suivi, sans préciser que des retards ont déjà été détectés tardivement. G=3 : impact croissant avec la durée du retard.",owner:"Directeur financier",control_ids:"C05",coso_principles:"P13, P14, P16, P17",basis:"Hypothèse",recommendation:"État périodique des échéances et retards ; chaque alerte attribuée à un responsable et suivie jusqu'à résolution (C05)."},{id:"R05",title:"Tension de trésorerie liée à l'accélération des décaissements",category:"Liquidité",event:"La cadence des décaissements dépasse les encaissements et les ressources disponibles, sans anticipation par la fonction finance.",causes:"Directes : volonté d'accélérer les décisions pour augmenter les volumes (fait du cas). Indirectes : absence de lien entre plan de production et plan de trésorerie (hypothèse à vérifier).",consequences:"Recours à des financements d'urgence plus coûteux ; report ou gel de décaissements ; dégradation de la relation client ; image de fragilité.",probability:3,gravity:4,justification:"P=3 : la croissance recherchée accroît l'exposition mais aucune donnée de trésorerie n'est fournie. G=4 : une rupture de liquidité affecte l'ensemble de l'activité.",owner:"Directeur financier",control_ids:"C05, C08",coso_principles:"P7, P13, P14",basis:"Hypothèse",recommendation:"Prévision glissante de trésorerie ; seuil d'escalade interne validé par la direction après analyse des flux (C05, C08)."},{id:"R06",title:"Inadéquation entre échéances des crédits et ressources",category:"Liquidité",event:"Les crédits accordés ont des échéances plus longues que les ressources mobilisées, créant un besoin de refinancement récurrent.",causes:"Directes : développement du financement sans cadrage des ressources (hypothèse à vérifier). Indirectes : concentration des sources de refinancement (hypothèse à vérifier).",consequences:"Dépendance à un nombre limité de financeurs ; coût de refinancement accru ; contrainte sur la capacité de croissance.",probability:2,gravity:5,justification:"P=2 : situation non établie par le cas, retenue comme risque structurel de la croissance. G=5 : une impasse de refinancement pourrait interrompre l'activité.",owner:"Directeur financier ; Direction générale",control_ids:"C05",coso_principles:"P7, P13, P14",basis:"Hypothèse",recommendation:"Tableau périodique des échéances des crédits et des ressources mobilisées ; identification des écarts de maturité et des sources de refinancement concentrées ; écarts significatifs soumis à la direction (C05)."},{id:"R07",title:"Décision hors délégation ou contournement du circuit d'autorisation",category:"Opérationnel",event:"Un crédit est autorisé par une personne ou une instance non habilitée, ou le même collaborateur constitue, analyse et valide un dossier.",causes:"Directes : responsabilités d'autorisation imprécises (fait du cas). Indirectes : absence de matrice de délégation signée ; conflit d'intérêts lié aux objectifs commerciaux.",consequences:"Décisions non opposables ; exposition à la fraude interne ; anomalies relevées par l'audit ; responsabilité des dirigeants engagée.",probability:4,gravity:4,justification:"P=4 : l'imprécision des responsabilités est un fait du cas. G=4 : le contournement atteint à la fois le risque de crédit, la conformité et la réputation.",owner:"Directeur général (délégations) ; Directeur des risques (contrôle)",control_ids:"C02, C03",coso_principles:"P3, P5",basis:"Constat",recommendation:"Matrice des délégations signée ; contrôle de l'habilitation avant validation ; interdiction de décaisser sans décision valide (C02, C03)."},{id:"R08",title:"Anomalies non remontées et données du dossier de mauvaise qualité",category:"Opérationnel",event:"Des anomalies relevées sur les dossiers ne sont ni tracées ni escaladées ; les mêmes erreurs se répètent.",causes:"Directes : suivi des anomalies insuffisamment formalisé et informations incohérentes (faits du cas). Indirectes : absence d'outil de registre ; absence de culture de remontée (hypothèse à vérifier).",consequences:"Impossibilité de mesurer les dérives ; décisions de direction fondées sur des données peu fiables ; réponses tardives aux alertes.",probability:4,gravity:3,justification:"P=4 : la formalisation insuffisante est un fait du cas. G=3 : pas de perte directe, mais effet multiplicateur sur les autres risques.",owner:"Directeur des risques",control_ids:"C01, C04, C08",coso_principles:"P13, P16, P17",basis:"Constat",recommendation:"Registre central des anomalies avec cause, criticité, responsable, échéance, preuve et validation de clôture ; contrôle du reporting avant diffusion (C04, C08)."}],controls:[{id:"C01",name:"Contrôle de complétude des dossiers",nature:"Préventif",objective:"Empêcher qu'un dossier incomplet ou incohérent n'atteigne la décision.",risk_ids:"R01, R08",procedure:"Liste de pièces obligatoires par type de crédit. Le chargé d'affaires coche la liste ; un analyste de la fonction risques, distinct, vérifie les pièces et la cohérence des données avant l'analyse de risque. Le dossier incomplet est retourné avec motif.",owner:"Analyste de la fonction risques",supervision:"Directeur des risques",frequency:"À chaque dossier, avant l'avis de risque",evidence:"Liste de contrôle signée et datée ; motif de retour tracé.",indicator:"Part des dossiers complets à la première présentation (cible à fixer par la direction) ; nombre de retours par motif.",anomaly_treatment:"Retour du dossier ; inscription au registre des anomalies (C04) ; escalade au Directeur commercial si répétition.",status:"En déploiement"},{id:"C02",name:"Double validation des décisions de crédit",nature:"Préventif",objective:"Éviter une décision prise par une seule personne et garantir le respect des délégations.",risk_ids:"R02, R03, R07",procedure:"Toute décision requiert deux validations indépendantes selon la matrice de délégation : avis de la fonction risques, puis autorisation par l'instance délégataire (direction ou comité de crédit). Un avis défavorable des risques impose un niveau supérieur et une motivation écrite.",owner:"Instance délégataire (direction générale ou comité de crédit)",supervision:"Directeur général",frequency:"À chaque décision",evidence:"Procès-verbal ou fiche de décision signée avec avis risques joint.",indicator:"Part des décisions conformes à la délégation ; nombre d'avis défavorables outrepassés.",anomaly_treatment:"Décision suspendue ; décaissement bloqué ; remontée à la direction générale.",status:"À concevoir"},{id:"C03",name:"Séparation des fonctions commerciales, de risques et d'autorisation",nature:"Préventif",objective:"Empêcher qu'un même collaborateur constitue, analyse et autorise un crédit.",risk_ids:"R03, R07",procedure:"Droits d'accès à l'outil de gestion des dossiers définis par rôle selon la matrice RACI. Le chargé d'affaires n'a pas de droit d'avis ni d'autorisation. Revue semestrielle des droits d'accès.",owner:"Direction générale (attribution des rôles) ; Contrôle interne (revue)",supervision:"Directeur général",frequency:"À l'attribution des droits ; revue semestrielle",evidence:"Tableau des droits par rôle ; compte rendu de revue des droits.",indicator:"Nombre de cumuls de rôles détectés lors de la revue.",anomaly_treatment:"Retrait immédiat des droits cumulés ; analyse des décisions concernées ; rapport à la direction.",status:"En déploiement"},{id:"C04",name:"Suivi des anomalies et des dérogations",nature:"Détectif et correctif",objective:"Tracer chaque anomalie et chaque dérogation, et en assurer la correction.",risk_ids:"R01, R08",procedure:"Registre unique des anomalies et dérogations (date, dossier, nature, auteur, motif, décision, échéance de régularisation). Toute dérogation est motivée et validée au niveau de la délégation. Point mensuel de revue du registre par la fonction risques.",owner:"Fonction risques (tenue du registre)",supervision:"Directeur général",frequency:"Tenue continue ; revue mensuelle",evidence:"Registre à jour ; compte rendu de la revue mensuelle.",indicator:"Anomalies ouvertes par ancienneté ; part de dérogations régularisées dans le délai.",anomaly_treatment:"Escalade à la direction générale au-delà du délai fixé ; plan d'action avec responsable.",status:"Opérationnel"},{id:"C05",name:"Surveillance des retards et de la liquidité",nature:"Détectif",objective:"Repérer tôt les impayés et les tensions de trésorerie.",risk_ids:"R04, R05, R06",procedure:"La fonction finance produit un état des échéances impayées par ancienneté et un plan de trésorerie prévisionnel confronté au calendrier des décaissements. Un seuil d'alerte qualitatif est défini dans la charte ; son dépassement déclenche une revue de la direction.",owner:"Fonction finance",supervision:"Directeur général",frequency:"Hebdomadaire pour les retards ; mensuelle pour la liquidité",evidence:"État des retards daté ; plan de trésorerie validé.",indicator:"Dossiers en retard par tranche d'ancienneté ; adéquation décaissements prévus / ressources.",anomaly_treatment:"Alerte à la direction ; ajustement ou gel des décaissements ; relance renforcée.",status:"À concevoir"},{id:"C06",name:"Revue périodique de la qualité du portefeuille",nature:"Détectif et correctif",objective:"Vérifier que la croissance ne se fait pas au détriment de la qualité du portefeuille.",risk_ids:"R02, R03",procedure:"Chaque trimestre, la fonction risques présente à la direction l'évolution de la qualité par segment, l'origine des dossiers dérogatoires et le respect de la charte. La direction arbitre entre croissance et prudence et le consigne.",owner:"Fonction risques",supervision:"Direction générale",frequency:"Trimestrielle",evidence:"Rapport trimestriel ; procès-verbal d'arbitrage.",indicator:"Indicateurs qualitatifs de la charte ; respect des délégations ; ancienneté des anomalies.",anomaly_treatment:"Plan correctif (resserrement des critères, révision des objectifs commerciaux).",status:"À concevoir"},{id:"C07",name:"Suivi de la concentration du portefeuille",nature:"Détectif",objective:"Repérer une exposition excessive à un secteur, une activité, une zone ou une catégorie de clientèle.",risk_ids:"R03",procedure:"La fonction risques ventile les expositions par secteur, activité, zone et catégorie de clientèle, commente toute concentration et propose des mesures de réduction. Les limites éventuelles sont fixées par la direction après analyse de données réelles.",owner:"Fonction risques",supervision:"Direction générale",frequency:"Mensuelle dans le dispositif cible",evidence:"Tableau de concentration commenté.",indicator:"Part des expositions par segment (seuils à définir après collecte de données réelles).",anomaly_treatment:"Analyse renforcée ; proposition de limites ou de mesures de réduction à la direction.",status:"À concevoir"},{id:"C08",name:"Contrôle du reporting",nature:"Détectif",objective:"Garantir que la direction décide sur des informations cohérentes, complètes et à jour.",risk_ids:"R05, R08",procedure:"Avant diffusion à la direction, la fonction finance vérifie la cohérence et l'exhaustivité des données, réalise les rapprochements entre échéanciers, encaissements et trésorerie, et valide le reporting.",owner:"Fonction finance",supervision:"Direction générale",frequency:"À chaque clôture de reporting",evidence:"Reporting validé ; rapprochements ; journal des corrections.",indicator:"Anomalies de reporting détectées ; respect des délais de transmission.",anomaly_treatment:"Correction, documentation de l'écart et diffusion d'une version rectifiée.",status:"En déploiement"}],coso_components:[{id:1,name:"Environnement de contrôle",principles:"P1 à P5",question:"Les rôles, l'éthique et les responsabilités sont-ils explicités ?",findings:"Constat certain : les responsabilités d'autorisation sont imprécises. Constat certain : les objectifs de volume sont en tension avec la qualité. Appréciation provisoire : environnement insuffisant sur la clarté des rôles.",gaps:"Délégations non précisées ; absence d'arbitrage formalisé entre volume et prudence ; risque de conflit d'intérêts commercial (hypothèse à vérifier).",risk_ids:"R03, R07",recommendations:"Matrice de délégation signée par la direction générale ; charte d'appétence ; objectifs commerciaux intégrant un critère de qualité ; matrice RACI.",owner:"Direction générale",indicators:"Nombre d'autorisations hors délégation ; part des objectifs commerciaux intégrant un critère de qualité.",maturity:2},{id:2,name:"Évaluation des risques",principles:"P6 à P9",question:"Les risques sont-ils identifiés et hiérarchisés ?",findings:"Constat certain : objectifs de volume et qualité en tension. Hypothèse à vérifier : absence de cartographie documentée. Appréciation provisoire : évaluation partielle, non structurée.",gaps:"Pas de hiérarchisation commune des risques ; pas de revue des risques lors du changement de stratégie de croissance (hypothèse à vérifier).",risk_ids:"R01, R02, R03, R05, R06",recommendations:"Registre des risques P×G mis à jour chaque trimestre ; revue des risques avant toute révision des objectifs commerciaux.",owner:"Fonction risques",indicators:"Date de dernière mise à jour du registre ; nombre de risques réévalués par trimestre.",maturity:2},{id:3,name:"Activités de contrôle",principles:"P10 à P12",question:"Quelles validations, vérifications et séparations des tâches existent ?",findings:"Constat certain : pièces incomplètes ; décisions selon des critères non harmonisés. Appréciation provisoire : activités de contrôle insuffisantes à l'octroi.",gaps:"Pas de contrôle de complétude indépendant ; pas de double validation ; traçabilité des décisions non établie (hypothèse à vérifier).",risk_ids:"R01, R02, R07",recommendations:"Contrôles C01 à C03 ; grille d'acceptation commune ; décision tracée avec identité du décideur et motif.",owner:"Foncti e à vérifier",diagnostic:"Surveillance du dispositif par l'organe compétent, selon le statut juridique de l'organisme.",risk_ids:"",assessment:"Non évalué"},{id:"P3",component_id:1,title:"Établit structures, lignes hiérarchiques, pouvoirs et responsabilités",nature:"Constat",diagnostic:"Responsabilités d'autorisation imprécises : structure et pouvoirs non établis.",risk_ids:"R07",assessment:"Déficient"},{id:"P4",component_id:1,title:"Démontre un engagement envers la compétence",nature:"Hypothèse à vérifier",diagnostic:"Compétence des chargés d'affaires en constitution de dossier et formation à la qualité documentaire.",risk_ids:"R01",assessment:"Non évalué"},{id:"P5",component_id:1,title:"Impose la responsabilité de chacun",nature:"Constat et hypothèse",diagnostic:"Constat : tension volume/qualité. Hypothèse : performance mesurée sans critère de qualité, donc responsabilisation déséquilibrée.",risk_ids:"R03, R07",assessment:"Déficient"},{id:"P6",component_id:2,title:"Définit des objectifs adaptés",nature:"Constat",diagnostic:"Objectifs de volume en tension avec la qualité du portefeuille : objectifs non alignés.",risk_ids:"R03",assessment:"Déficient"},{id:"P7",component_id:2,title:"Identifie et analyse les risques",nature:"Constat",diagnostic:"Critères de décision non harmonisés. Hypothèse : cartographie des risques inexistante.",risk_ids:"R02, R05, R06",assessment:"Partiel"},{id:"P8",component_id:2,title:"Évalue le risque de fraude",nature:"Hypothèse à vérifier",diagnostic:"Risque de fraude (dossiers falsifiés, collusion) non évalué.",risk_ids:"R01, R07",assessment:"Non évalué"},{id:"P9",component_id:2,title:"Identifie et analyse les changements importants",nature:"Hypothèse à vérifier",diagnostic:"Effets de la croissance (volumes, nouveaux produits) sur les risques non analysés.",risk_ids:"R03, R05",assessment:"Non évalué"},{id:"P10",component_id:3,title:"Sélectionne et développe des activités de contrôle",nature:"Constat",diagnostic:"Dossiers incomplets : contrôles à l'octroi insuffisants.",risk_ids:"R01, R02",assessment:"Déficient"},{id:"P11",component_id:3,title:"Sélectionne et développe des contrôles généraux sur la technologie",nature:"Hypothèse à vérifier",diagnostic:"Droits d'accès et traçabilité dans l'outil de gestion des dossiers.",risk_ids:"R07",assessment:"Non évalué"},{id:"P12",component_id:3,title:"Déploie par des politiques et des procédures",nature:"Constat",diagnostic:"Critères non harmonisés : procédures non déployées ou non appliquées de façon homogène.",risk_ids:"R01, R02",assessment:"Déficient"},{id:"P13",component_id:4,title:"Utilise des informations pertinentes et de qualité",nature:"Constat",diagnostic:"Informations incohérentes : qualité de l'information non assurée.",risk_ids:"R01, R08",assessment:"Déficient"},{id:"P14",component_id:4,title:"Communique en interne",nature:"Hypothèse à vérifier",diagnostic:"Circuit d'alerte entre commercial, finance, risques et direction.",risk_ids:"R04, R05, R06",assessment:"Non évalué"},{id:"P15",component_id:4,title:"Communique avec l'externe",nature:"Hypothèse à vérifier",diagnostic:"Communication externe (clients, financeurs, autorités) selon le statut.",risk_ids:"",assessment:"Non évalué"},{id:"P16",component_id:5,title:"Effectue des évaluations continues et/ou ponctuelles",nature:"Constat",diagnostic:"Suivi des anomalies insuffisamment formalisé : évaluations continues faibles.",risk_ids:"R04, R08",assessment:"Déficient"},{id:"P17",component_id:5,title:"Évalue et communique les déficiences",nature:"Constat et hypothèse",diagnostic:"Constat : formalisation insuffisante. Hypothèse : pas de plan correctif suivi jusqu'à clôture.",risk_ids:"R04, R08",assessment:"Partiel"}],recommendations:[{id:"REC01",risk_id:"R01",coso_gap:"Activités de contrôle (P10, P12) : contrôle de complétude et application de la procédure insuffisants (constat).",action:"Checklist obligatoire des pièces ; blocage du dossier tant qu'une pièce obligatoire manque ; conservation de la preuve du c
