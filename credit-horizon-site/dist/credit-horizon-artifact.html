erm:60,stage2:9,stage3:3},{id:"S06",sector:"Services professionnels, scientifiques et techniques",ead:45e6,collateral:35,term:48,stage2:5,stage3:2},{id:"S07",sector:"Santé et action sociale",ead:35e6,collateral:60,term:84,stage2:4,stage3:1},{id:"S08",sector:"Agriculture, sylviculture, pêche et chasse",ead:3e7,collateral:75,term:96,stage2:7,stage3:2},{id:"S09",sector:"Autres services",ead:2e7,collateral:40,term:48,stage2:8,stage3:3}],Ls=[["Mission principale","Évaluer, mesurer et maîtriser le risque de non-remboursement"],["Orientation","Maîtrise du risque"],["Approche","Analyse individuelle et globale du portefeuille"],["Analyse financière","Oui, avec un focus sur le risque"],["Garanties","Oui"],["Probabilité de défaut (PD)","Oui : outil clé"],["Suivi des impayés","Oui : suivi rapproché"],["Analyse du portefeuille","Approfondie : concentration, secteurs"],["Provisions et pertes attendues","Important : modélisation des pertes"],["Reporting","Important : indicateurs de risque"],["Compétences clés","Analyse des risques, modèles (PD, LGD, EAD), réglementation (Bâle II/III, IFRS 9)"],["Exemple concret","Mesurer l'impact d'un défaut sur le portefeuille de 500 M et ajuster les provisions"]];var be={GR:"Gestion des risques financiers",CI:"Contrôle interne"},xe=[{id:"risque",course:"GR",chap:1,title:"Le risque",def:"Possibilité qu'un résultat effectif diffère du résultat attendu. Pour ISO 31000 : l'effet de l'incertitude sur les objectifs.",key:"3 ingrédients : une incertitude, un objectif, un événement qui peut changer l'atteinte de l'objectif.",project:"Objectif de Crédit Horizon : croître tout en restant prudent. Incertitude : la capacité des TPE à rembourser. Le risque central est R03, la dégradation du portefeuille sous la pression des volumes.",link:"risks"},{id:"perte",course:"GR",chap:1,title:"Risque ≠ perte",def:"Le risque existe avant l'événement ; la perte n'est qu'une conséquence possible de sa réalisation.",key:"Risque = possibilité. Perte = matérialisation.",project:"Le registre liste des risques (R01 à R08) avant toute perte ; le registre des anomalies enregistre ce qui s'est réellement produit.",link:"risks"},{id:"exposition",course:"GR",chap:1,title:"Incertitude, exposition",def:"Une incertitude ne devient un risque que s'il existe une exposition : un actif, un passif, un engagement ou une position touché par un facteur de risque.",key:"Facteur de risque → Exposition → Événement → Conséquence.",project:"Facteur : la santé financière des TPE. Exposition : l'encours de crédits (500 M MAD fictifs). Événement : le défaut. Conséquence : la perte et les provisions.",link:"credit:mesure"},{id:"cec",course:"GR",chap:1,title:"Cause, événement, conséquence",def:"Analyser un risque, c'est séparer la cause (ce qui provoque), l'événement (ce qui se produit) et la conséquence (l'impact).",key:"Cause → Événement → Conséquence : la base de toute cartographie.",project:"Chaque fiche du registre a ces trois champs. R01 : cause = pièces manquantes ; événement = crédit accordé sur dossier incomplet ; conséquence = perte, garantie inutilisable.",link:"risks"},{id:"proba",course:"GR",chap:1,title:"Probabilité et impact",def:"Deux dimensions de l'analyse. La probabilité peut être qualitative (faible, élevée), semi-quantitative (note de 1 à 5) ou quantitative (2 %, 5 %).",key:"Probabilité = chance que ça arrive. Impact = gravité si ça arrive.",project:"Le registre utilise une échelle semi-quantitative de 1 à 5. Le module Risque de crédit passe au quantitatif : PD à 12 mois en %.",link:"credit:params"},{id:"criticite",course:"GR",chap:1,title:"Criticité",def:"Outil simple de hiérarchisation : criticité = probabilité × impact. Pédagogique, il ne remplace pas l'analyse professionnelle.",key:"Criticité = P × I. Seuils du projet : 1–4 faible, 5–9 modéré, 10–15 élevé, 16–25 critique.",project:"R03 = 4 × 5 = 20 (critique) ; R07 = 4 × 4 = 16 (critique) ; R04 = 3 × 3 = 9 (modéré).",link:"risks"},{id:"pur",course:"GR",chap:1,title:"Risque pur et risque spéculatif",def:"Pur : seulement « pas de perte » ou « perte » (incendie, fraude, panne). Spéculatif : gain ou perte possibles (achat d'une action).",key:"Pur = on le subit. Spéculatif = on le choisit pour gagner.",project:"Octroyer un crédit est un risque spéculatif (marge d'intérêt ou perte). La fraude documentaire ou le contournement du circuit (R07) sont des risques purs.",link:"risks"},{id:"el",course:"GR",chap:1,title:"Perte attendue et perte inattendue",def:"Perte attendue : moyenne statistique, EL = PD × LGD × EAD. Perte inattendue : pertes au-delà de ce niveau (crise, défauts simultanés, événements extrêmes).",key:"EL = PD × LGD × EAD → couverte par les provisions. L'inattendu → couvert par les fonds propres.",project:"Pertes attendues à 12 mois : 9,49 M MAD ; provisions IFRS 9 : 21,25 M MAD. En récession sévère, les provisions montent à 37,81 M MAD : l'écart illustre la perte inattendue.",link:"credit:stress"},{id:"rr",course:"GR",chap:1,title:"Couple risque-rendement",def:"On n'accepte plus de risque que contre un rendement attendu plus élevé. Rendement R = (P1 − P0 + D) / P0 ; risque de marché mesuré par la volatilité (écart-type).",key:"Risque élevé ≠ rendement élevé garanti : on parle de rendement ATTENDU.",project:"C'est la problématique du projet : la croissance des volumes (rendement) contre la prudence (risque). La charte d'appétence fixe jusqu'où aller.",link:"framework:charte"},{id:"diversif",course:"GR",chap:1,title:"Diversification et concentration",def:"Répartir les expositions entre clients, secteurs, régions réduit le risque spécifique, mais pas le risque de marché global.",key:"Ne pas mettre tous ses œufs dans le même panier… mais le panier entier peut tomber.",project:"Concentration du portefeuille fictif : les 3 premiers secteurs pèsent 52 % (indice HHI 0,136). Suivi par le contrôle C07.",link:"credit:mesure"},{id:"processus",course:"GR",chap:1,title:"Processus de gestion des risques",def:"Six étapes : identifier, analyser, évaluer, hiérarchiser, traiter (éviter, réduire, transférer, accepter), surveiller. Le système doit être dynamique.",key:"« IAEHTS » : Il Aime Écrire, Hélas Trop Souvent.",project:"Identifier : registre R01–R08. Analyser : causes et conséquences. Évaluer : P × G, PD et LGD. Hiérarchiser : matrice et top 5. Traiter : contrôles C01–C08 et plan d'action. Surveiller : anomalies, indicateurs, dashboard.",link:"overview"},{id:"categories",course:"GR",chap:1,title:"Grandes catégories de risques",def:"Marché, taux, change, crédit, liquidité, opérationnel. Une entreprise non financière peut être exposée à tous en même temps (cas Atlas Industries).",key:"« MTC-CLO » : Marché, Taux, Change, Crédit, Liquidité, Opérationnel.",project:"Crédit Horizon : crédit (R01–R04), liquidité (R05–R06), opérationnel (R07–R08). Taux et change sont indirects (voir la typologie).",link:"framework:typo"},{id:"marche",course:"GR",chap:2,title:"Risque de marché",def:"Perte due aux variations des paramètres de marché : actions, taux, change, matières premières. Ce n'est pas seulement le « risque boursier ».",key:"4 facteurs : actions, taux, devises, matières premières.",project:"Crédit Horizon ne détient pas de portefeuille de titres : exposition directe faible. Le risque de marché arrive surtout par les taux.",link:"framework:typo"},{id:"taux",course:"GR",chap:2,title:"Risque de taux",def:"Une variation des taux affecte la valeur d'un actif, d'un passif ou des flux futurs. Hausse des taux → baisse du prix des obligations à taux fixe.",key:"Taux ↑ → prix des obligations ↓ (et inversement).",project:"Si les ressources de Crédit Horizon sont à taux variable, une hausse des taux renchérit le refinancement et réduit la marge (lien avec R06). Les TPE à taux variable deviennent plus fragiles : la PD augmente.",link:"framework:typo"},{id:"change",course:"GR",chap:2,title:"Risque de change",def:"Une variation de devise affecte une transaction, un actif, une dette. Le même mouvement avantage les uns et pénalise les autres : tout dépend du sens de l'exposition.",key:"Importateur : devise ↑ = perte. Exportateur : devise ↓ = perte.",project:"Les crédits sont en MAD : pas d'exposition directe. Indirectement, une TPE cliente qui importe en dollars voit ses coûts monter, ce qui augmente son risque de défaut.",link:"framework:typo"},{id:"credit",course:"GR",chap:2,title:"Risque de crédit et ses dimensions",def:"Perte due à l'incapacité ou au refus d'un emprunteur de payer intégralement et à temps. Dimensions : défaut, dégradation de la qualité de crédit, contrepartie, concentration.",key:"Défaut · Dégradation · Contrepartie · Concentration (« les 4 D-C »).",project:"Défaut : PD et R03. Dégradation : encours en stade 2 d'IFRS 9. Concentration : C07 et HHI. Contrepartie : faible (pas de dérivés).",link:"credit:mesure"},{id:"liquidite",course:"GR",chap:2,title:"Liquidité de marché et de financement",def:"Marché : vendre vite un actif sans forte décote. Financement : disposer du cash pour payer à l'échéance. On peut être solvable mais illiquide.",key:"Solvabilité = capacité globale. Liquidité = cash au bon moment.",project:"R05 : tension de trésorerie liée à l'accélération des décaissements (financement). R06 : crédits longs financés par des ressources courtes. Contrôle C05.",link:"risks"},{id:"operationnel",course:"GR",chap:2,title:"Risque opérationnel",def:"Bâle : pertes dues à des processus internes défaillants, des personnes, des systèmes ou des événements externes (risque juridique inclus). La résilience opérationnelle est la capacité à continuer malgré une perturbation.",key:"4 sources : Personnes, Processus, Systèmes, Externes (« PPSE »).",project:"R07 : contournement du circuit d'autorisation (personnes et processus). R08 : anomalies non remontées et données de mauvaise qualité (processus et systèmes).",link:"risks"},{id:"systematique",course:"GR",chap:2,title:"Risque spécifique et systématique",def:"Spécifique : propre à une entreprise (perte d'un client, incendie) ; réduit par la diversification. Systématique : touche tout le marché (récession, inflation) ; non diversifiable.",key:"Spécifique = diversifiable. Systématique = il faut le stresser.",project:"Défaut d'un client de 5 M MAD = spécifique. Récession sévère (PD × 2) = systématique : on le mesure avec le stress test.",link:"credit:stress"},{id:"interdep",course:"GR",chap:2,title:"Interdépendance des risques",def:"Un risque en déclenche un autre ; en crise, les corrélations augmentent. Exemple du cours : taux → marché → crédit → liquidité.",key:"Un risque n'est jamais seul : penser « effet domino ».",project:"Chaîne de Crédit Horizon : pression des volumes → critères non harmonisés (R02) → dossiers incomplets (R01) → dégradation du portefeuille (R03) → retards (R04) → tension de trésorerie (R05) → refinancement (R06).",link:"framework:typo"},{id:"cartographie",course:"GR",chap:2,title:"Cartographie des risques",def:"Représentation structurée des risques. 7 étapes : risque, exposition, cause, conséquences, probabilité, impact, criticité. Outil d'aide à la décision, pas un verdict.",key:"Cartographie = registre + matrice P × I.",project:"La matrice 5 × 5 de la page Risques place R03 et R07 en zone critique, R04 en zone modérée.",link:"risks"},{id:"residuel",course:"GR",chap:2,title:"Risque inhérent et risque résiduel",def:"Inhérent : avant les dispositifs de maîtrise. Résiduel : ce qui reste après. Un risque couvert à 80 % n'a pas disparu.",key:"Résiduel = inhérent − effet des contrôles.",project:"Les cotes du registre sont des cotes inhérentes. La fiche de chaque risque indique aussi un risque résiduel visé une fois les contrôles en service (hypothèse à vérifier).",link:"risks"},{id:"traitement",course:"GR",chap:2,title:"Stratégies de traitement",def:"Quatre réponses : éviter (renoncer à l'activité), réduire (contrôles), transférer (assurance, garantie, couverture), accepter (risque dans l'appétence).",key:"« ERTA » : Éviter, Réduire, Transférer, Accepter.",project:"Crédit Horizon réduit surtout (contrôles C01–C08) ; il transfère une partie du risque de crédit par les garanties et vise à diversifier ses ressources pour R06.",link:"risks"},{id:"ci-pourquoi",course:"CI",chap:1,title:"Pourquoi un contrôle interne ?",def:"Toute organisation poursuit des objectifs dont l'atteinte n'est pas certaine. Le contrôle interne n'est pas « contrôler les salariés » : c'est maîtriser le fonctionnement et les risques.",key:"Objectifs → Risques → Contrôles → Assurance raisonnable.",project:"Crédit Horizon : objectif de croissance prudente → risques R01–R08 → contrôles C01–C08 → assurance raisonnable donnée à la direction.",link:"controls"},{id:"ci-evol",course:"CI",chap:1,title:"Approche traditionnelle et contemporaine",def:"Hier : comptable, vérification a posteriori, protection du patrimoine. Aujourd'hui : maîtrise des risques, prévention, contrôles intégrés aux processus, responsabilité partagée.",key:"D'un contrôle « après coup » à un contrôle « dans le processus ».",project:"La plateforme intègre les contrôles dans le circuit : le dossier TPE est bloqué tant qu'une pièce manque (C01), avant la décision.",link:"dossiers"},{id:"ci-def",course:"CI",chap:1,title:"Définition et assurance raisonnable",def:"Ensemble organisé et permanent de dispositifs, procédures et comportements qui donne une assurance raisonnable, jamais absolue, d'atteindre les objectifs.",key:"4 idées : un processus, toute l'organisation, orienté objectifs, pas de certitude.",project:"Même avec les 8 contrôles en service, un défaut reste possible : d'où les provisions et le suivi continu.",link:"controls"},{id:"ci-coso",course:"CI",chap:1,title:"Définition du COSO",def:"Processus mis en œuvre par le conseil, le management et le personnel pour donner une assurance raisonnable sur les opérations, le reporting et la conformité.",key:"COSO : Opérations · Reporting · Conformité.",project:"Le diagnostic COSO 2013 de la plateforme évalue les 17 principes de Crédit Horizon.",link:"controls:coso"},{id:"ci-types",course:"CI",chap:1,title:"Préventif, détectif, correctif",def:"Préventif : avant l'événement (autorisation). Détectif : repère une anomalie déjà survenue (rapprochement). Correctif : traite l'anomalie et évite qu'elle se répète.",key:"Avant · Pendant/après · Réparer.",project:"C01, C02, C03 sont préventifs ; C05, C07, C08 détectifs ; C04 et C06 détectifs et correctifs.",link:"controls"},{id:"ci-objectifs",course:"CI",chap:1,title:"Les 4 objectifs du contrôle interne",def:"Opérations (efficacité et efficience), reporting (information fiable), conformité (lois et règlements), protection des actifs.",key:"« ORCA » : Opérations, Reporting, Conformité, Actifs.",project:"Opérations : C01, C02, C06. Reporting : C08. Conformité : C03 (délégations). Actifs : les créances, protégées par C05 et C07.",link:"controls"},{id:"ci-fonctions",course:"CI",chap:1,title:"Contrôle interne, audit, contrôle de gestion, gestion des risques",def:"Contrôle interne : maîtriser activités et risques. Audit interne : évaluer de façon indépendante. Contrôle de gestion : piloter la performance (écarts budgétaires). Gestion des risques : maîtriser l'incertitude globale.",key:"Faire fonctionner ≠ évaluer ≠ piloter la performance ≠ cartographier.",project:"Double validation C02 = contrôle interne ; revue du processus de crédit par l'audit = audit interne ; suivi des volumes contre budget = contrôle de gestion ; registre et PD = gestion des risques.",link:"framework:lignes"},{id:"ci-gouv",course:"CI",chap:1,title:"Gouvernance et coût-bénéfice",def:"Le contrôle interne est un mécanisme de gouvernance. Il ne s'agit pas de multiplier les contrôles : trop ralentit, trop peu expose.",key:"Le bon nombre de contrôles dépend du risque et du coût.",project:"Huit contrôles ciblés, chacun relié à au moins un risque et à un indicateur, plutôt qu'une liste exhaustive.",link:"controls"},{id:"ci-5",course:"CI",chap:2,title:"Les 5 composantes du COSO",def:"Environnement de contrôle, évaluation des risques, activités de contrôle, information et communication, pilotage. Elles sont interdépendantes.",key:"« EEAIP » : Et Ensuite, Agir Intelligemment et Piloter.",project:"Le diagnostic COSO donne une maturité par composante ; dans les données de démonstration, l'environnement de contrôle, les activités de contrôle et l'information et communication sont les plus faibles (1/5).",link:"controls:coso"},{id:"ci-env",course:"CI",chap:2,title:"Environnement de contrôle",def:"Socle du dispositif : intégrité, éthique, structure, responsabilités, compétences. Le « tone at the top » : l'exemple donné par les dirigeants.",key:"Si la direction contourne, tout le monde contourne.",project:"R07 (décisions hors délégation) est une faiblesse de l'environnement de contrôle : la charte et les délégations y répondent.",link:"framework:charte"},{id:"ci-eval",course:"CI",chap:2,title:"Évaluation des risques",def:"Identifier et analyser les risques qui menacent les objectifs pour décider comment les maîtriser. Criticité = probabilité × impact, outil de hiérarchisation.",key:"On ne contrôle bien que ce que l'on a évalué.",project:"Le registre P × G et la matrice 5 × 5.",link:"risks"},{id:"ci-activites",course:"CI",chap:2,title:"Activités de contrôle et séparation des fonctions",def:"Autorisation, vérification, rapprochement, séparation des fonctions, contrôles physiques et informatiques. Une même personne ne doit pas tenir toute une opération sensible.",key:"Séparer « AEEC » : Autorisation, Exécution, Enregistrement, Contrôle.",project:"C03 sépare constitution (commercial), analyse (risques) et autorisation (instance délégataire). La matrice RACI vérifie qu'aucun acteur ne cumule les trois.",link:"framework:raci"},{id:"ci-info",course:"CI",chap:2,title:"Information et communication",def:"Pas de contrôle sans information fiable. Communication descendante (direction → équipes), ascendante (signalements), horizontale (entre services).",key:"Descendante · Ascendante · Horizontale.",project:"Registre des anomalies (C04) pour la remontée, contrôle du reporting (C08), Risk Advisor et exports pour la diffusion.",link:"actions:anoms"},{id:"ci-pilotage",course:"CI",chap:2,title:"Activités de pilotage",def:"Vérifier dans la durée que les composantes existent et fonctionnent : surveillance continue ou évaluations ponctuelles (audit interne).",key:"Activité de contrôle = maîtriser une opération. Pilotage = contrôler les contrôles.",project:"Indicateurs du dashboard, statut et date de revue de chaque contrôle, plan d'action.",link:"overview"},{id:"ci-organes",course:"CI",chap:2,title:"Organes responsables",def:"Conseil et comité d'audit (surveillance), direction générale (conception, culture), management opérationnel (applique), fonctions risques et conformité, audit interne (évalue), chaque collaborateur.",key:"Le contrôle interne est l'affaire de tous, à des niveaux différents.",project:"Acteurs du projet : chargé d'affaires, direction commerciale, fonction finance, fonction risques (analyste risque crédit), direction générale / comité de crédit, contrôle interne / audit.",link:"framework:raci"},{id:"ci-3lignes",course:"CI",chap:2,title:"Le modèle des Trois Lignes (IIA)",def:"1re ligne : le management opérationnel possède et gère les risques. 2e ligne : risques et conformité apportent expertise et challenge. 3e ligne : l'audit interne donne une assurance indépendante.",key:"1re fait · 2e surveille · 3e assure.",project:"1re : chargés d'affaires et direction commerciale. 2e : fonction risques (analyste risque crédit) et fonction finance pour la liquidité. 3e : audit interne. Gouvernance : direction générale et conseil.",link:"framework:lignes"}],ws=[{label:"Les 6 étapes de la gestion des risques",mnemo:"IAEHTS — « Il Aime Écrire, Hélas Trop Souvent »",detail:"Identifier, Analyser, Évaluer, Hiérarchiser, Traiter, Surveiller"},{label:"Les 4 traitements d'un risque",mnemo:"ERTA",detail:"Éviter, Réduire, Transférer, Accepter"},{label:"Les 6 catégories de risques du cours",mnemo:"MTC-CLO",detail:"Marché, Taux, Change, Crédit, Liquidité, Opérationnel"},{label:"Les 4 sources du risque opérationnel",mnemo:"PPSE",detail:"Personnes, Processus, Systèmes, Événements externes"},{label:"Analyse d'un risque",mnemo:"Cause → Événement → Conséquence",detail:"et, en amont : Facteur de risque → Exposition"},{label:"Criticité",mnemo:"C = P × I",detail:"Seuils du projet : 1–4 faible, 5–9 modéré, 10–15 élevé, 16–25 critique"},{label:"Perte attendue",mnemo:"EL = PD × LGD × EAD",detail:"Probabilité de défaut × perte en cas de défaut × exposition. Couverte par les provisions ; l'inattendu par les fonds propres"},{label:"Rendement d'un actif",mnemo:"R = (P1 − P0 + D) / P0",detail:"Risque de marché mesuré par la volatilité (écart-type des rendements)"},{label:"Les 4 objectifs du contrôle interne",mnemo:"ORCA",detail:"Opérations, Reporting, Conformité, protection des Actifs"},{label:"Les 5 composantes du COSO",mnemo:"EEAIP — « Et Ensuite, Agir Intelligemment et Piloter »",detail:"Environnement de contrôle, Évaluation des risques, Activités de contrôle, Information et communication, Pilotage"},{label:"Séparation des fonctions",mnemo:"AEEC",detail:"Autorisation, Exécution, Enregistrement, Contrôle : jamais toutes dans les mêmes mains"},{label:"Types de contrôles",mnemo:"Préventif · Détectif · Correctif",detail:"Avant l'événement · après, pour le repérer · pour réparer et éviter la répétition"},{label:"Trois Lignes",mnemo:"1re fait · 2e surveille · 3e assure",detail:"Management opérationnel · risques et conformité · audit interne"},{label:"La logique du contrôle interne",mnemo:"Objectifs → Risques → Contrôles → Acteurs → Surveillance → Amélioration",detail:"Le fil rouge des deux chapitres"}],is=[{course:"GR",chap:1,q:"Quelle différence entre risque et incertitude ?",a:"L'incertitude est l'impossibilité de connaître le futur. Elle devient un risque lorsqu'il existe une exposition : un actif, une dette ou un engagement qu'elle peut toucher."},{course:"GR",chap:1,q:"Qu'appelle-t-on une exposition au risque ?",a:"Un actif, un passif, un engagement, une transaction ou une position qu'un facteur de risque peut affecter. Exemple : devoir payer 1 000 000 USD dans 3 mois."},{course:"GR",chap:1,q:"Quelle différence entre risque et perte ?",a:"Le risque existe avant l'événement : c'est une possibilité. La perte est la matérialisation d'une partie de ce risque."},{course:"GR",chap:1,q:"Relation entre probabilité, impact et criticité ?",a:"Criticité = probabilité × impact. Elle sert à hiérarchiser : un risque peu probable mais grave (2 × 5 = 10) peut dépasser un risque fréquent mais faible (4 × 2 = 8)."},{course:"GR",chap:1,q:"Perte attendue et perte inattendue ?",a:"La perte attendue est une moyenne statistique (EL = PD × LGD × EAD), couverte par les provisions. La perte inattendue dépasse ce niveau (crise, défauts simultanés) et relève des fonds propres."},{course:"GR",chap:1,q:"Pourquoi un rendement attendu élevé n'est-il pas garanti ?",a:"Parce qu'il est seulement attendu : un placement risqué peut rapporter plus, moins, ou faire perdre. Risque élevé ≠ rendement élevé garanti."},{course:"GR",chap:1,q:"Quel est l'intérêt de la diversification ?",a:"Répartir les expositions limite l'effet d'un problème propre à un client ou un secteur (risque spécifique). Elle ne supprime pas le risque systématique."},{course:"GR",chap:1,q:"Quelles sont les étapes du processus de gestion des risques ?",a:"Identifier, analyser, évaluer, hiérarchiser, traiter (éviter, réduire, transférer, accepter), surveiller. Moyen mnémotechnique : IAEHTS."},{course:"GR",chap:2,q:"Quelles sont les composantes du risque de marché ?",a:"Actions, taux d'intérêt, taux de change, matières premières."},{course:"GR",chap:2,q:"Pourquoi le prix d'une obligation à taux fixe baisse-t-il quand les taux montent ?",a:"Les nouvelles obligations rapportent plus : pour rester attractive, l'ancienne doit être vendue moins cher."},{course:"GR",chap:2,q:"Différence entre risque de crédit et risque de contrepartie ?",a:"Le risque de crédit porte sur un emprunteur qui ne rembourse pas. Le risque de contrepartie porte sur l'autre partie d'une transaction (dérivé, swap, forward) qui n'honore pas le contrat avant son terme."},{course:"GR",chap:2,q:"Donnez un exemple de risque de concentration.",a:"Une banque dont 40 % des crédits sont dans l'immobilier ; chez Crédit Horizon, les 3 premiers secteurs représentent 52 % de l'encours fictif."},{course:"GR",chap:2,q:"Liquidité de marché et liquidité de financement ?",a:"Marché : vendre un actif vite sans forte décote. Financement : disposer du cash pour payer ses échéances sans perturber l'activité."},{course:"GR",chap:2,q:"Peut-on être solvable mais illiquide ?",a:"Oui : 100 M d'actifs pour 60 M de dettes, mais 3 M de trésorerie pour 15 M à payer demain. La solvabilité est globale, la liquidité est une question de timing."},{course:"GR",chap:2,q:"Quatre sources du risque opérationnel ?",a:"Personnes, processus, systèmes, événements externes (PPSE)."},{course:"GR",chap:2,q:"Risque spécifique et risque systématique ?",a:"Spécifique : propre à une entreprise, réduit par la diversification. Systématique : touche tout le marché (récession, inflation), non diversifiable."},{course:"GR",chap:2,q:"Pourquoi la diversification ne supprime-t-elle pas tous les risques ?",a:"Parce qu'elle n'agit pas sur le risque systématique : en récession, toutes les positions baissent en même temps."},{course:"GR",chap:2,q:"Comment un risque de marché peut-il entraîner un risque de liquidité ?",a:"Une hausse des taux fait baisser les obligations ; des déposants retirent leurs fonds ; la banque doit vendre ses obligations à perte pour trouver du cash."},{course:"GR",chap:2,q:"Qu'appelle-t-on risque inhérent ?",a:"Le niveau de risque avant la prise en compte des dispositifs de maîtrise."},{course:"GR",chap:2,q:"Qu'appelle-t-on risque résiduel ?",a:"Le risque qui subsiste après les dispositifs de maîtrise. Exemple : une dette en USD couverte à 80 % garde 20 % de risque."},{course:"CI",chap:1,q:"Pourquoi le contrôle interne ne garantit-il pas l'atteinte des objectifs ?",a:"Il donne une assurance raisonnable seulement : erreurs humaines, collusion, contournement par la direction, événements externes et rapport coût-bénéfice limitent toujours son efficacité."},{course:"CI",chap:1,q:"Différence entre contrôle interne et audit interne ?",a:"Le contrôle interne fait partie du fonctionnement (une double signature). L'audit interne évalue de façon indépendante si ce dispositif est adéquat et efficace (une mission d'audit du processus achats)."},{course:"CI",chap:1,q:"Catégories d'objectifs du contrôle interne ?",a:"Opérations, reporting, conformité, protection des actifs (ORCA)."},{course:"CI",chap:1,q:"Pourquoi relier un contrôle à un risque et à un objectif ?",a:"Pour qu'il soit pertinent : sans risque identifié, le contrôle coûte sans protéger ; sans objectif, on ne peut pas juger s'il est efficace."},{course:"CI",chap:1,q:"Une double signature est-elle toujours efficace ?",a:"Non : si le second signataire signe sans vérifier, s'il est subordonné au premier ou s'il y a collusion, le contrôle n'existe que sur le papier."},{course:"CI",chap:2,q:"Cinq composantes du contrôle interne selon le COSO ?",a:"Environnement de contrôle, évaluation des risques, activités de contrôle, information et communication, pilotage."},{course:"CI",chap:2,q:"Pourquoi l'environnement de contrôle est-il le socle ?",a:"Parce qu'il fixe la culture : si les dirigeants tolèrent les contournements (tone at the top), même de bonnes procédures perdent leur efficacité."},{course:"CI",chap:2,q:"Activité de contrôle et activité de pilotage ?",a:"L'activité de contrôle maîtrise une opération (valider un paiement). Le pilotage vérifie dans la durée que les contrôles existent et fonctionnent (revue, audit)."},{course:"CI",chap:2,q:"Pourquoi une même personne ne doit-elle pas créer un fournisseur, saisir sa facture et la payer ?",a:"Elle pourrait créer un fournisseur fictif et se payer sans que personne ne le voie : il faut séparer autorisation, exécution, enregistrement et contrôle."},{course:"CI",chap:2,q:"Responsabilité du management et de l'audit interne ?",a:"Le management (1re ligne) fait fonctionner les contrôles et en est responsable. L'audit interne (3e ligne) les évalue en toute indépendance, sans les exploiter."}],ns=[{course:"GR",chap:2,title:"Exercice 1 — Classification",statement:"Identifier le risque principal : A. cyberattaque d'une banque ; B. payer 3 M EUR dans 4 mois ; C. baisse d'un portefeuille obligataire après une hausse des taux ; D. un client ne rembourse pas ; E. pas assez de liquidités pour les retraits ; F. un fonds a 45 % dans un seul secteur.",solution:["A. Risque opérationnel (systèmes, événement externe).","B. Risque de change : une appréciation de l'euro augmente le coût en MAD.","C. Risque de taux, composante du risque de marché.","D. Risque de crédit (défaut).","E. Risque de liquidité de financement.","F. Risque de concentration."]},{course:"GR",chap:2,title:"Exercice 2 — Change",statement:"Payer 600 000 USD. Taux aujourd'hui 9,90 MAD, à l'échéance 10,25 MAD.",solution:["Montant prévu : 600 000 × 9,90 = 5 940 000 MAD.","Montant payé : 600 000 × 10,25 = 6 150 000 MAD.","Surcoût de change : 6 150 000 − 5 940 000 = 210 000 MAD."]},{course:"GR",chap:2,title:"Exercice 3 — Perte attendue",statement:"Exposition 5 M DH, PD = 4 %, LGD = 50 %.",solution:["EL = PD × LGD × EAD = 0,04 × 0,50 × 5 000 000 = 100 000 DH.","C'est une moyenne statistique, pas une perte certaine.","Dans Crédit Horizon, le même calcul donne 9,49 M MAD sur le portefeuille fictif de 500 M MAD."]},{course:"GR",chap:2,title:"Exercice 4 — Criticité",statement:"A (4 ; 3), B (2 ; 5), C (5 ; 2), D (3 ; 5). Calculer, hiérarchiser, commenter deux criticités égales.",solution:["A = 12, B = 10, C = 10, D = 15. Ordre : D, A, puis B et C.","B et C ont la même criticité mais pas la même nature : B est rare et grave (plan de continuité, transfert par assurance ou garantie), C est fréquent et peu grave (réduction par des contrôles de routine, automatisation).","La criticité hiérarchise ; elle ne dit pas comment traiter."]},{course:"CI",chap:1,title:"Exercice 1 — Classification des fonctions",statement:"A. deux signatures au-delà de 200 000 MAD ; B. une équipe indépendante examine le processus de crédit pour le comité d'audit ; C. comparaison mensuelle dépenses / budget ; D. une banque identifie les scénarios de pertes et leur probabilité.",solution:["A. Contrôle interne (activité de contrôle préventive : autorisation).","B. Audit interne (assurance indépendante).","C. Contrôle de gestion (pilotage de la performance, analyse des écarts).","D. Gestion des risques (identification et évaluation)."]},{course:"CI",chap:1,title:"Exercice 2 — Objectif du contrôle",statement:"Rapprochement bancaire ; double validation d'un paiement ; vérification réglementaire avant commercialisation ; contrôle automatique d'un reporting ; inventaire physique.",solution:["Rapprochement bancaire : reporting (fiabilité) et protection des actifs.","Double validation : protection des actifs.","Vérification réglementaire : conformité.","Contrôle automatique du reporting : reporting.","Inventaire physique : protection des actifs et reporting.","Oui, un même contrôle sert souvent plusieurs objectifs."]},{course:"CI",chap:1,title:"Exercice 3 — Atlas Finance",statement:"Une personne crée un fournisseur et saisit sa facture ; virements sans seconde validation ; pas de rapprochement depuis 3 mois ; reporting corrigé après transmission ; droits d'accès d'anciens salariés actifs ; budget dépassé de 18 %.",solution:["Création fournisseur + facture : risque de fournisseur fictif → protection des actifs → séparer la création des tiers et la saisie des factures.","Virements sans 2e validation : paiement non autorisé → actifs → double validation au-delà d'un seuil.","Pas de rapprochement : erreurs et fraudes non détectées → reporting et actifs → rapprochement mensuel par une personne qui ne paie pas.","Reporting corrigé après envoi : information non fiable → reporting → revue et validation avant diffusion.","Accès d'anciens salariés : accès frauduleux → actifs et systèmes → revue périodique des habilitations, désactivation au départ.","Budget dépassé de 18 % : relève d'abord du contrôle de gestion ; ce n'est une défaillance du contrôle interne que si des dépenses ont été engagées sans autorisation.","Priorité : les trois premiers ensemble (ils permettent une fraude non détectée), puis les accès, puis le reporting, puis le budget."]},{course:"CI",chap:1,title:"Exercice 4 — « Beaucoup de contrôles = bon contrôle interne ? »",statement:"Commenter l'affirmation.",solution:["Faux. La qualité compte plus que la quantité.","Un contrôle doit être relié à un objectif et à un risque, être pertinent et proportionné à son coût.","Trop de contrôles ralentit l'activité et peut être contourné ; et même un bon dispositif ne donne qu'une assurance raisonnable.","Exemple du projet : 8 contrôles ciblés, chacun relié à un risque (R01–R08) et à un indicateur."]},{course:"CI",chap:2,title:"Exercice 1 — Identifier les composantes",statement:"Code d'éthique ; cartographie des risques ; double validation des paiements ; procédure diffusée à tous ; audit interne qui vérifie les contrôles ; droits informatiques limités.",solution:["Code d'éthique : environnement de contrôle.","Cartographie : évaluation des risques.","Double validation : activités de contrôle.","Procédure diffusée : information et communication.","Vérification par l'audit : pilotage.","Droits informatiques limités : activités de contrôle (contrôles informatiques)."]},{course:"CI",chap:2,title:"Exercice 2 — Qui est responsable ?",statement:"A. Examiner indépendamment le processus de paiement ; B. autoriser les paiements de sa délégation ; C. suivre l'exposition globale au risque de marché ; D. vérifier une nouvelle obligation réglementaire ; E. superviser les défaillances majeures.",solution:["A. Audit interne.","B. Management opérationnel.","C. Risk management.","D. Conformité.","E. Conseil d'administration / comité d'audit."]},{course:"CI",chap:2,title:"Exercice 3 — Financia SA",statement:"Cartographie non actualisée depuis 3 ans ; droits correspondant aux anciennes fonctions ; exceptions accordées par la direction sans justification ; incidents non transmis à la fonction risques ; rapprochement fait par la personne qui paie ; trésorerie non auditée depuis 4 ans.",solution:["Cartographie ancienne : évaluation des risques → risques nouveaux ignorés → fonction risques et direction → actualisation au moins annuelle.","Droits obsolètes : activités de contrôle → accès non autorisés → management et informatique → revue des habilitations à chaque mobilité.","Exceptions sans justification : environnement de contrôle (tone at the top) → contournement généralisé → conseil / comité d'audit → dérogations écrites, motivées et tracées.","Incidents non remontés : information et communication → risques invisibles → management opérationnel → procédure et registre des incidents.","Rapprochement par celui qui paie : activités de contrôle (séparation) → fraude dissimulée → direction financière → confier le rapprochement à une autre personne.","Trésorerie non auditée : pilotage → défaillances non détectées → audit interne et comité d'audit → plan d'audit fondé sur les risques.","Le constat le plus révélateur de l'environnement de contrôle : les exceptions accordées par la direction elle-même."]},{course:"CI",chap:2,title:"Exercice 4 — « L'audit interne est responsable du contrôle interne ? »",statement:"Commenter l'affirmation.",solution:["Faux. Le management (1re ligne) fait fonctionner les contrôles et en est responsable.","Les fonctions risques et conformité (2e ligne) apportent expertise et challenge.","L'audit interne (3e ligne) évalue en toute indépendance ; s'il gérait les contrôles, il perdrait cette indépendance.","Dans Crédit Horizon : le chargé d'affaires et la direction commerciale appliquent, la fonction risques surveille, l'audit évalue."]}],Ms=[{type:"Crédit : défaut",course:"Un emprunteur ne paie pas",exposure:"Cœur du métier : crédits aux TPE",level:"Directe",where:"R01, R02, R03 · PD, LGD, EL"},{type:"Crédit : dégradation",course:"La qualité de l'emprunteur baisse avant le défaut",exposure:"TPE en retard ou fragilisées",level:"Directe",where:"R04 · stade 2 d'IFRS 9 · C05, C06"},{type:"Crédit : concentration",course:"Trop d'expositions sur un même client ou secteur",exposure:"Secteurs dominants du portefeuille",level:"Directe",where:"R03 · HHI, top 3 · C07"},{type:"Crédit : contrepartie",course:"L'autre partie d'un contrat ne l'honore pas",exposure:"Pas de dérivés ; banques partenaires",level:"Faible",where:"Hors périmètre"},{type:"Liquidité de financement",course:"Manquer de cash à l'échéance",exposure:"Décaissements accélérés",level:"Directe",where:"R05, R06 · C05, C08"},{type:"Liquidité de marché",course:"Vendre un actif avec une forte décote",exposure:"Crédits difficiles à céder",level:"Indirecte",where:"R06"},{type:"Opérationnel",course:"Personnes, processus, systèmes, externes",exposure:"Circuit d'octroi, données, délégations",level:"Directe",where:"R07, R08 · C01, C03, C04"},{type:"Taux",course:"Variation des taux d'intérêt",exposure:"Coût du refinancement ; TPE à taux variable",level:"Indirecte",where:"R06 · stress test (PD)"},{type:"Change",course:"Variation des devises",exposure:"TPE clientes importatrices",level:"Indirecte",where:"Facteur de PD sectorielle"},{type:"Actions et matières premières",course:"Variation des prix de marché",exposure:"Pas de portefeuille de titres",level:"Faible",where:"Hors périmètre"}],js=[{id:"Cause",text:"Pression sur les volumes, critères non harmonisés"},{id:"R02",text:"Décisions d'octroi hétérogènes"},{id:"R01",text:"Crédits accordés sur dossiers incomplets"},{id:"R03",text:"Dégradation du portefeuille (crédit)"},{id:"R04",text:"Reta
