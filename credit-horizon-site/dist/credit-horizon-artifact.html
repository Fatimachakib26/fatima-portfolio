<title>Crédit Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>/* Crédit Horizon · Risk Intelligence — modèle « Dashboard exécutif » (première version) :
   barre latérale vert foncé, cartes arrondies, indicateurs à liseré coloré, graphiques. */
:root {
  --g950: #04261c; --g900: #063b2b; --g800: #0a4d38; --g700: #0d6047; --g600: #0f7a58; --g500: #10b981; --g400: #34d399; --g100: #d1fae5; --g50: #ecfdf5;
  --chrome: #04261c; --chrome-ink: #e6f4ee; --chrome-dim: #9fd8c1;
  --work: #f3f6f5; --surface: #ffffff; --surface-2: #f8fafc; --head: #f8fafc; --toolbar: transparent;
  --line: #e2e8f0; --line-2: #f1f5f9; --ink: #0f1f1a; --ink-2: #475569; --ink-3: #64748b;
  --brand: #0a4d38; --brand-2: #0d6047; --brand-soft: #d1fae5; --on-brand: #ffffff; --select: #ecfdf5; --hover: #f0fdf7;
  --ok: #047857; --ok-soft: #d1fae5; --warn: #b45309; --warn-soft: #fef3c7; --bad: #dc2626; --bad-soft: #fee2e2; --info: #0369a1; --info-soft: #e0f2fe; --mute: #475569; --mute-soft: #f1f5f9;
  --l-low: #16a34a; --l-mid: #ca8a04; --l-high: #ea580c; --l-crit: #dc2626;
  --c-low: #bbf7d0; --c-mid: #fef08a; --c-high: #fed7aa; --c-crit: #fca5a5;
  --shadow: 0 1px 2px rgba(6, 59, 43, .05), 0 4px 16px rgba(6, 59, 43, .05);
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --work: #0b1411; --surface: #121d19; --surface-2: #17241f; --head: #17241f;
    --line: #26352f; --line-2: #1c2a25; --ink: #e2ebe7; --ink-2: #b4c4bd; --ink-3: #8a9b94;
    --brand: #34d399; --brand-2: #6ee7b7; --brand-soft: #123a2c; --on-brand: #04120d; --select: #143328; --hover: #172b24;
    --ok: #6ee7b7; --ok-soft: #123a2c; --warn: #fbbf24; --warn-soft: #3a2c0d; --bad: #f87171; --bad-soft: #3d1515; --info: #7dd3fc; --info-soft: #0f2a3a; --mute: #a3b3ac; --mute-soft: #1c2a25;
    --c-low: #14532d; --c-mid: #4d4209; --c-high: #5a2c0c; --c-crit: #5f1d1d; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --work: #0b1411; --surface: #121d19; --surface-2: #17241f; --head: #17241f;
  --line: #26352f; --line-2: #1c2a25; --ink: #e2ebe7; --ink-2: #b4c4bd; --ink-3: #8a9b94;
  --brand: #34d399; --brand-2: #6ee7b7; --brand-soft: #123a2c; --on-brand: #04120d; --select: #143328; --hover: #172b24;
  --ok: #6ee7b7; --ok-soft: #123a2c; --warn: #fbbf24; --warn-soft: #3a2c0d; --bad: #f87171; --bad-soft: #3d1515; --info: #7dd3fc; --info-soft: #0f2a3a; --mute: #a3b3ac; --mute-soft: #1c2a25;
  --c-low: #14532d; --c-mid: #4d4209; --c-high: #5a2c0c; --c-crit: #5f1d1d; --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--work); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; color: var(--ink); letter-spacing: -.01em; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
small { color: var(--ink-3); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--surface-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--g500); outline-offset: 2px; }

/* ---------- coque ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--ink-3); }
.mark { width: 38px; height: 38px; flex: none; }
.mark rect { fill: #0f7a58; }
.mark path { stroke: #ffffff; }
.boot .mark { width: 52px; height: 52px; }
.shell { display: flex; min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: 250px; background: linear-gradient(180deg, var(--g950), var(--g900)); color: #e6f4ee; display: flex; flex-direction: column; z-index: 40; padding: 16px 12px; }
.logo { display: flex; gap: 10px; align-items: center; padding: 0 4px; }
.logo b { display: block; color: #fff; font-size: 15px; letter-spacing: .04em; }
.logo small { display: block; color: var(--g400); font-size: 9.5px; letter-spacing: .3em; font-weight: 700; }
.side nav { flex: 1; overflow-y: auto; margin: 14px 0; }
.ng { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #9fd8c1; margin: 14px 10px 4px; font-weight: 700; }
.side nav a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; color: #d6efe5; text-decoration: none; font-size: 13.5px; border: 1px solid transparent; }
.side nav a .ic { color: var(--g400); }
.side nav a span { flex: 1; }
.side nav a:hover { background: rgba(255, 255, 255, .06); }
.side nav a.on { background: rgba(16, 185, 129, .18); color: #fff; border-color: rgba(16, 185, 129, .45); }
.side nav a em { font-style: normal; font-size: 10.5px; font-weight: 700; background: #dc2626; color: #fff; border-radius: 6px; padding: 0 6px; }
.me { border-top: 1px solid rgba(255, 255, 255, .12); padding: 12px 4px 0; display: flex; gap: 10px; align-items: center; }
.me .av { width: 34px; height: 34px; border-radius: 50%; background: var(--g500); color: #04261c; display: grid; place-items: center; font-weight: 800; font-size: 12.5px; flex: none; }
.me b { display: block; color: #fff; font-size: 13px; }
.me small { color: #9fd8c1; font-size: 11.5px; }
.main { flex: 1; min-width: 0; margin-left: 250px; display: flex; flex-direction: column; min-height: 100vh; }
main { padding: 22px 28px; max-width: 1440px; width: 100%; outline: none; }
.top { display: none; }
.demo-bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #f5f3ff; border-bottom: 1px solid #ddd6fe; color: #5b21b6; font-size: 12px; padding: 6px 28px; }
.demo-bar .sync { color: #6d28d9; }
.demo-bar .sync.on::before { content: "● "; color: #10b981; }
.foot { margin-top: auto; padding: 14px; text-align: center; color: #94a3b8; font-size: 11.5px; border-top: 1px solid var(--line); }
.icon-btn { background: none; border: 1px solid transparent; padding: 4px; border-radius: 8px; cursor: pointer; color: var(--ink-2); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); border-color: var(--line); }

/* ---------- barre d'outils de l'écran ---------- */
.ph { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 -16px 12px; padding: 8px 16px; background: var(--toolbar); border-bottom: 1px solid var(--line); }
.ph h1 { font-size: 16px; font-weight: 600; }
.lead { margin: 1px 0 0; color: var(--ink-3); font-size: 12px; max-width: 110ch; }
.eyebrow { margin: 0 0 2px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.ph-a { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; background: var(--surface); color: var(--ink); text-decoration: none; white-space: nowrap; line-height: 1.4; }
.btn:hover { background: var(--hover); border-color: var(--ink-3); }
.btn:active { background: var(--select); }
.btn .ic { width: 14px; height: 14px; }
.btn.primary { background: var(--brand); border-color: var(--brand-2); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-2); }
.btn.ghost { background: var(--surface); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-t { color: var(--bad); }
.btn.sm { padding: 1px 7px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link, .more { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; text-decoration: underline; font-size: 12px; }
.lk { color: var(--ink); text-decoration: none; }
.lk:hover { color: var(--brand); text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 4px 11px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--select); color: var(--ink); font-weight: 600; }
.seg.sm button { padding: 2px 9px; font-size: 12px; }
.seg.sm button.on.oui { background: var(--ok); color: #fff; }
.seg.sm button.on.non { background: var(--bad); color: #fff; }
.seg.sm button.on.na { background: var(--mute); color: var(--surface); }

/* ---------- panneaux (cadres à en-tête) ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 0 12px 12px; margin-bottom: 12px; min-width: 0; }
.panel > :not(.panel-h):first-child { margin-top: 12px; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 -12px 10px; padding: 6px 12px; background: var(--head); border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 12.5px; font-weight: 700; }
.panel-h p { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-3); }
.grid { display: grid; gap: 12px; }
.grid > * { min-width: 0; }
.grid.top { align-items: start; }
.g-7-5 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.g-1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-1-1-1 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid .panel { margin-bottom: 0; }
.grid + .grid, .grid + .panel, .panel + .grid, .metrics + .grid, .note + .grid, .metrics + .panel { margin-top: 12px; }
.small { font-size: 12px; color: var(--ink-3); margin: 6px 0 0; }

/* ---------- indicateurs ---------- */
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.metrics.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metric { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 3px; padding: 8px 12px 9px; }
.metric span { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.metric strong { display: block; font-size: 22px; font-weight: 600; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }
.metric strong em { font-style: normal; font-size: 13px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.metric small { display: block; font-size: 11.5px; }
.metric.bad { border-top-color: var(--bad); } .metric.bad strong { color: var(--bad); }
.metric.warn { border-top-color: var(--warn); } .metric.warn strong { color: var(--warn); }

/* ---------- grilles de données ---------- */
.tw { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-2); padding: 5px 8px; background: var(--head); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-2); white-space: nowrap; position: sticky; top: 0; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); vertical-align: top; }
th:last-child, td:last-child { border-right: 0; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
tr:last-child td { border-bottom: 0; }
td small { display: block; margin-top: 1px; font-size: 11.5px; }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.center th:not(:first-child), table.center td:not(:first-child) { text-align: center; }
table.hover tr.row { cursor: default; }
table.hover tr.row:hover td { background: var(--hover); }
table.hover tr.row.on td { background: var(--select); }
td.ids, .ids { white-space: nowrap; }
.mcell { display: flex; align-items: center; gap: 6px; }
.mcell span { font-variant-numeric: tabular-nums; min-width: 48px; }
.empty { padding: 22px 8px; text-align: center; color: var(--ink-3); display: grid; justify-items: center; gap: 10px; border: 1px dashed var(--line); background: var(--surface-2); }
.empty p { margin: 0; max-width: 60ch; }
.empty b { color: var(--ink); }
.toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.toolbar input { flex: 1; min-width: 200px; }
.toolbar select { width: auto; }
.count { font-size: 11.5px; color: var(--ink-3); }

/* ---------- marqueurs ---------- */
.ref { display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; margin-right: 3px; line-height: 1.5; }
.tag { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 2px; padding: 0 6px; background: var(--surface-2); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--mute); background: var(--mute-soft); padding: 0 6px; border-radius: 2px; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--ok); background: var(--ok-soft); } .st.info { color: var(--info); background: var(--info-soft); } .st.warn { color: var(--warn); background: var(--warn-soft); } .st.bad { color: var(--bad); background: var(--bad-soft); }
.lvl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; padding: 0 6px 0 0; }
.lvl i { width: 10px; height: 10px; border-radius: 2px; }
.lvl b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--ink-2); margin-left: 2px; }
.lvl.low { color: var(--l-low); } .lvl.low i { background: var(--l-low); }
.lvl.mid { color: var(--l-mid); } .lvl.mid i { background: var(--l-mid); }
.lvl.high { color: var(--l-high); } .lvl.high i { background: var(--l-high); }
.lvl.crit { color: var(--l-crit); } .lvl.crit i { background: var(--l-crit); }
.prio { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 0 5px; border-radius: 2px; }
.prio.p1 { background: var(--bad-soft); color: var(--bad); } .prio.p2 { background: var(--warn-soft); color: var(--warn); } .prio.p3 { background: var(--mute-soft); color: var(--mute); }
.meter { display: inline-block; width: 100%; max-width: 110px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--brand); }
.meter.bad i { background: var(--l-crit); } .meter.ok i { background: var(--ok); }
.dot-on { color: var(--brand); font-size: 11px; }
.mute-t { color: var(--ink-3); } .ok-t { color: var(--ok) !important; } .bad-t { color: var(--bad) !important; }
.note { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-left: 4px solid var(--info); background: var(--surface); border-radius: 2px; padding: 7px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink-2); }
.note .ic { width: 15px; height: 15px; margin-top: 1px; }
.note.lock { border-left-color: var(--mute); }
.note.ok { border-left-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.note.bad { border-left-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

/* ---------- graphiques ---------- */
.cols { display: flex; gap: 4px; align-items: stretch; height: 170px; padding: 4px 0 0; border-left: 1px solid var(--line); background: repeating-linear-gradient(0deg, transparent 0 33px, var(--line-2) 33px 34px); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.col .v { font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.col .bar { flex: 1; width: 100%; max-width: 36px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--ink-3); }
.col .bar i { display: block; width: 100%; background: var(--brand); min-height: 2px; }
.col.muted .bar i { background: color-mix(in srgb, var(--brand) 40%, var(--surface)); }
.col .l { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }

.mx { display: flex; gap: 6px; }
.mx-yl { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.mx-g { flex: 1; display: grid; grid-template-columns: 100px repeat(5, minmax(0, 1fr)); gap: 2px; }
.mx.compact .mx-g { grid-template-columns: 16px repeat(5, minmax(0, 1fr)); }
.mx-ax { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-align: right; padding-right: 4px; }
.mx-ax.x { align-items: center; text-align: center; padding: 3px 0 0; }
.mx-ax small { font-weight: 400; font-size: 10.5px; }
.mx-c { position: relative; min-height: 66px; border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); padding: 4px; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; }
.mx.compact .mx-c { min-height: 36px; padding: 3px; }
.mx-c.low { background: var(--c-low); } .mx-c.mid { background: var(--c-mid); } .mx-c.high { background: var(--c-high); } .mx-c.crit { background: var(--c-crit); }
.mx-c em { position: absolute; right: 4px; bottom: 2px; font-style: normal; font-size: 10px; color: var(--ink-3); }
.mx-r { font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; cursor: pointer; }
.mx-r:hover, .mx-r.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.mx-xl { text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }

/* ---------- vue d'ensemble ---------- */
.todo { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); }
.todo li a { display: grid; grid-template-columns: 220px 1fr; gap: 10px; padding: 6px 10px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line-2); border-left: 4px solid var(--line); }
.todo li:last-child a { border-bottom: 0; }
.todo li.bad a { border-left-color: var(--bad); } .todo li.warn a { border-left-color: var(--warn); }
.todo li a:hover { background: var(--hover); }
.todo b { font-weight: 600; }
.todo span { font-size: 12px; color: var(--ink-2); }

/* ---------- fiche risque ---------- */
.detail h2 { font-size: 13.5px; }
.score-line { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
.treat { margin: 8px 0 10px; padding: 6px 10px; border-left: 3px solid var(--brand); background: var(--surface-2); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 0; margin: 0; font-size: 12.5px; border: 1px solid var(--line-2); }
.kv dt { color: var(--ink-2); font-size: 12px; font-weight: 600; background: var(--surface-2); padding: 5px 8px; border-bottom: 1px solid var(--line-2); }
.kv dd { margin: 0; padding: 5px 8px; border-bottom: 1px solid var(--line-2); }
.kv.stack { grid-template-columns: 130px 1fr; }
.kv.two { grid-template-columns: 170px 1fr; }
.kv.compact { grid-template-columns: 1fr auto; font-size: 12px; }
.kv.compact dt { font-weight: 500; }
.kv.compact dd { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.li { margin-bottom: 2px; }
.dlg-a { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
.dlg-a.left { justify-content: flex-start; }
.hash { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

/* ---------- formulaires ---------- */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.form.f3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form.f4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
.fld label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 2px; }
.fld label i { color: var(--bad); font-style: normal; }
.fld small { display: block; font-size: 11px; margin-top: 2px; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 4px 7px; font-size: 13px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
textarea { min-height: 70px; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-2); }
.range { display: flex; align-items: center; gap: 8px; }
.range input { padding: 0; border: 0; box-shadow: none; accent-color: var(--brand); }
.range output { font-family: var(--mono); font-weight: 700; min-width: 24px; }
.chk { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.chk:last-child { border-bottom: 0; }
.chk small { display: block; font-size: 11px; }
.sticky { position: sticky; top: 56px; }
.analysis h2 { font-size: 13.5px; }
.analysis h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 12px 0 4px; }
.analysis h3 span { font-weight: 500; color: var(--ink-3); text-transform: none; margin-left: 4px; }
.verdict { padding: 7px 10px; font-size: 12.5px; border-left: 4px solid; }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.comp { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.comp .meter { max-width: none; flex: 1; }
.comp b { font-variant-numeric: tabular-nums; }
.find { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.find li { padding: 3px 0 3px 13px; position: relative; }
.find li::before { content: ""; position: absolute; left: 0; top: 9px; width: 7px; height: 7px; background: var(--info); }
.find li.alerte::before { background: var(--bad); } .find li.attention::before { background: var(--warn); }

/* ---------- contrôle interne ---------- */
.sheet { border-top: 1px solid var(--line-2); }
.sheet:first-of-type { border-top: 0; }
.sheet summary { display: flex; align-items: center; gap: 8px; padding: 7px 4px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.sheet summary:hover { background: var(--hover); }
.sheet summary::-webkit-details-marker { display: none; }
.sheet summary::before { content: "▸"; color: var(--ink-3); font-size: 11px; }
.sheet[open] summary::before { content: "▾"; }
.sheet .kv { margin: 2px 0 12px; }
.coso-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.coso { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
.coso h3 { font-size: 12.5px; font-weight: 600; min-height: 2.6em; }
.coso .comp { margin-top: 6px; }
td select { min-width: 126px; padding: 2px 6px; font-size: 12px; }

/* ---------- plan d'action ---------- */
.chains { display: grid; gap: 8px; }
.chain { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
.chain header { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--head); border-bottom: 1px solid var(--line); }
.chain header .btn { margin-left: auto; }
.chain ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.chain li { padding: 8px 10px; border-left: 1px solid var(--line-2); font-size: 12px; position: relative; }
.chain li:first-child { border-left: 0; }
.chain li:not(:last-child)::after { content: "›"; position: absolute; right: -6px; top: 6px; color: var(--brand); font-weight: 700; background: var(--surface); }
.chain li span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--brand); font-weight: 700; margin-bottom: 2px; }
.chain li p { margin: 0; }

/* ---------- référentiel ---------- */
.zone { border-top: 4px solid var(--l-low); padding-top: 10px; }
.zone.renforcee { border-top-color: var(--l-high); }
.zone.inacceptable { border-top-color: var(--l-crit); }
.zone h2 { font-size: 13.5px; margin-bottom: 4px; }
.zone ul { padding-left: 18px; font-size: 12px; margin: 8px 0; }
.zone .zr { border-top: 1px solid var(--line-2); padding-top: 6px; }
.plain { margin: 0; padding-left: 18px; }
.plain li { margin: 3px 0; }
.esc { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.esc > span { font-family: var(--mono); font-weight: 700; font-size: 11.5px; border-radius: 2px; padding: 1px 6px; height: fit-content; }
.esc .n1 { background: var(--mute-soft); color: var(--mute); } .esc .n2 { background: var(--warn-soft); color: var(--warn); } .esc .n3 { background: var(--bad-soft); color: var(--bad); }
.esc .small { margin-top: 1px; }
table.raci th:not(:first-child), table.raci td:not(:first-child) { text-align: center; }
table.raci th { white-space: normal; min-width: 88px; }
.rc { display: inline-block; min-width: 28px; font-family: var(--mono); font-size: 11.5px; font-weight: 700; border-radius: 2px; padding: 0 4px; }
.rc.rR { background: var(--brand-soft); color: var(--brand); }
.rc.rA, .rc.rAR { background: var(--brand); color: var(--on-brand); }
.rc.rC { background: var(--info-soft); color: var(--info); }
.rc.rI { color: var(--ink-2); }
.rc.rn { color: var(--line); }

/* ---------- portefeuille ---------- */
.insights { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line-2); }
.insights li { display: grid; grid-template-columns: 90px 1fr; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }
.insights p { margin: 0; font-size: 12.5px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: 1px 8px; padding: 5px 0; border-bottom: 1px solid var(--line-2); }
.steps li::before { content: counter(s); grid-row: span 2; width: 20px; height: 20px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 11px; font-weight: 700; border-radius: 2px; }
.steps span { font-size: 12px; color: var(--ink-2); }
.recon { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 4px 0 12px; flex-wrap: wrap; }
.recon div { text-align: center; border: 1px solid var(--line); padding: 6px 14px; background: var(--surface-2); }
.recon strong { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.recon span { font-size: 11.5px; color: var(--ink-3); }
.recon > b { font-size: 18px; color: var(--ink-3); font-weight: 400; }

/* ---------- assistant ---------- */
.advisor { display: grid; gap: 8px; }
.chat { background: var(--surface); border: 1px solid var(--line); padding: 14px; min-height: 340px; max-height: 62vh; overflow-y: auto; }
.starter { display: grid; gap: 10px; }
.prompts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.prompts button { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; cursor: pointer; display: grid; gap: 3px; }
.prompts button:hover { border-color: var(--brand); background: var(--hover); }
.prompts b { font-weight: 600; font-size: 12.5px; }
.prompts span { font-size: 11.5px; color: var(--ink-3); }
.msg { margin-bottom: 12px; max-width: 920px; }
.msg.user { margin-left: auto; width: fit-content; max-width: 75%; background: var(--brand); color: var(--on-brand); border-radius: 3px; padding: 7px 12px; }
.msg.assistant { border: 1px solid var(--line-2); border-left: 3px solid var(--brand); padding: 6px 12px; background: var(--surface); }
.md h2, .md h3, .md h4 { margin: 10px 0 4px; font-size: 13.5px; }
.md p { margin: 5px 0; }
.md ul, .md ol { padding-left: 20px; margin: 5px 0; }
.md li.sub { list-style: circle; margin-left: 14px; }
.md table { margin: 6px 0; font-size: 12px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 7px; white-space: normal; position: static; }
.md blockquote { margin: 6px 0; padding: 5px 10px; border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--warn); }
.md code { font-family: var(--mono); font-size: 12px; }
.ask { display: flex; gap: 6px; align-items: flex-end; }
.ask textarea { min-height: 36px; max-height: 150px; resize: none; }

/* ---------- administration ---------- */
.exports { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.exp { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.exp:hover { border-color: var(--brand); background: var(--hover); }
.exp span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.people { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line-2); }
.people li { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--line-2); }

/* ---------- onglets, fenêtres, notifications ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { background: var(--surface-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--surface); color: var(--ink); font-weight: 600; border-top: 2px solid var(--brand); }
.tabs button span { font-size: 11px; color: var(--ink-3); margin-left: 5px; }
#modal { display: none; }
#modal.open { display: block; }
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 12, .4); z-index: 60; }
.dlg { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 16px 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .3); }
.dlg.small { width: min(460px, calc(100vw - 24px)); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; margin: 0 -16px 12px; padding: 7px 10px 7px 16px; background: var(--chrome); color: var(--chrome-ink); position: sticky; top: 0; }
.dlg-h h3 { font-size: 13px; color: var(--chrome-ink); font-weight: 600; }
.dlg-h .icon-btn { color: var(--chrome-ink); }
.dlg-h .icon-btn:hover { background: rgba(255, 255, 255, .12); border-color: transparent; }
.dlg table td { border-right: 0; }
.err { color: var(--bad); font-size: 12.5px; margin: 0; min-height: 1px; }
.toast { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); background: var(--chrome); color: var(--chrome-ink); border-left: 4px solid #4ade80; padding: 8px 14px; border-radius: 3px; font-size: 12.5px; opacity: 0; transform: translateY(6px); transition: .18s; z-index: 70; pointer-events: none; max-width: 380px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast.show { opacity: 1; transform: none; }
.toast.bad { border-left-color: #f87171; }

/* ---------- adaptatif ---------- */
@media (max-width: 1180px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metrics .metric:nth-child(5):last-child { grid-column: span 2; }
  .coso-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .prompts, .exports { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chain ol { grid-template-columns: 1fr; }
  .chain li { border-left: 0; border-top: 1px solid var(--line-2); }
  .chain li::after { display: none; }
}
@media (max-width: 980px) {
  .g-7-5, .g-1-1, .g-1-1-1, .insights { grid-template-columns: 1fr; }
  .sticky { position: static; }
  .form.f3, .form.f4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .todo li a { grid-template-columns: 1fr; gap: 0; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  .win { min-height: 100vh; }
  .body { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 45; top: 0; bottom: 0; left: 0; width: 260px; transform: translateX(-100%); transition: transform .18s; box-shadow: 0 0 40px rgba(0, 0, 0, .25); padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  body.nav-open .side { transform: none; }
  .tb-menu { display: inline-grid; }
  .tb-sub, .tb-user { display: none; }
  .titlebar { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .menubar { overflow-x: auto; }
  .mnu-l { position: fixed; left: 8px; right: 8px; top: 72px; min-width: 0; }
  main { padding: 0 max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); overflow: visible; }
  .ph { margin: 0 -12px 10px; padding: 8px 12px; }
  .metrics, .metrics.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics .metric:nth-child(5):last-child { grid-column: 1 / -1; }
  .coso-row { grid-template-columns: 1fr 1fr; }
  .form, .form.f3, .form.f4, .prompts, .exports { grid-template-columns: 1fr; }
  .kv, .kv.two, .kv.stack { grid-template-columns: 1fr; }
  .mx-g { grid-template-columns: 20px repeat(5, minmax(0, 1fr)); }
  .mx-ax small { display: none; }
  .insights li { grid-template-columns: 1fr; gap: 4px; }
  .statusbar .sb-r, .statusbar > span:nth-child(2) { display: none; }
  .msg.user { max-width: 90%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .titlebar, .menubar, .side, .statusbar, .ph-a, .tabs, .btn { display: none !important; } .body { display: block; } main { overflow: visible; } .panel { break-inside: avoid; } }

/* ================================================================
   Modèle « première version » : composants arrondis et aérés
   ================================================================ */
.ph { position: static; margin: 0 0 18px; padding: 0; background: none; border: 0; align-items: flex-end; }
.ph-t { display: flex; gap: 12px; align-items: flex-start; }
.ph-i { background: var(--g800); color: var(--g400); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.ph-i .ic { width: 22px; height: 22px; }
.ph h1 { font-size: 25px; font-weight: 750; color: var(--g950); }
.lead { font-size: 13.5px; margin-top: 4px; color: var(--ink-3); }
.ph-a { gap: 8px; }
.btn { border-radius: 10px; padding: 7px 13px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.btn.primary { background: var(--g800); border-color: var(--g800); color: #fff; }
.btn.primary:hover { background: var(--g700); }
.btn.em { background: var(--g500); border-color: var(--g500); color: #fff; }
.btn.em:hover { background: var(--g600); }
.btn.sm { padding: 3px 9px; font-size: 12px; border-radius: 8px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.seg { border-radius: 10px; }
.panel { border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 14px; }
.panel > :not(.panel-h):first-child { margin-top: 0; }
.panel-h { margin: 0 0 12px; padding: 0; background: none; border: 0; }
.panel-h h2 { font-size: 15px; font-weight: 700; color: var(--g950); }
.panel-h p { font-size: 12px; margin-top: 2px; }
.grid { gap: 14px; }
.grid + .grid, .grid + .panel, .panel + .grid, .metrics + .grid, .note + .grid, .metrics + .panel { margin-top: 14px; }
.metrics { gap: 12px; margin-bottom: 14px; }
.metric { border-radius: 14px; border: 1px solid var(--line); border-top: 4px solid var(--g600); padding: 12px 14px; box-shadow: var(--shadow); }
.metric strong { font-size: 25px; font-weight: 750; color: var(--g950); }
.metric.bad { border-top-color: var(--bad); }
.metric.warn { border-top-color: #f59e0b; }
.metric.warn strong { color: var(--warn); }
.tw { border: 0; }
table { font-size: 13px; }
th { background: var(--surface-2); color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 9px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-right: 0; border-bottom: 1px solid var(--line-2); }
tbody tr:nth-child(even) td { background: transparent; }
table.hover tr.row:hover td { background: var(--hover); }
table.hover tr.row.on td { background: var(--select); }
.kv { border: 0; border-radius: 10px; overflow: hidden; }
.kv dt { background: transparent; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--line-2); }
.kv dd { border-bottom: 1px solid var(--line-2); }
.ref { border-radius: 6px; font-weight: 700; }
.st { border-radius: 999px; padding: 1px 8px; }
.prio { border-radius: 6px; padding: 1px 6px; }
.tag { border-radius: 6px; }
.note { border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--info); }
.note.lock { background: #fffbeb; border-color: #fde68a; border-left-color: #f59e0b; color: #92400e; }
.empty { border-radius: 12px; }
.meter { border: 0; border-radius: 99px; height: 8px; background: var(--line); overflow: hidden; }
.meter i { border-radius: 99px; background: var(--g600); }
.tabs { gap: 6px; border-bottom: 0; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 7px 13px; font-weight: 600; color: var(--ink-2); margin: 0; }
.tabs button.on { background: var(--g800); border-color: var(--g800); color: #fff; border-top: 1px solid var(--g800); }
.tabs button.on span { color: #c7f0de; }
input, select, textarea { border-radius: 10px; padding: 7px 10px; }
.mx-g { gap: 5px; }
.mx-c { border-radius: 9px; border: 0; }
.mx-c em { font-weight: 700; color: rgba(15, 23, 42, .45); }
.mx-r { border-radius: 6px; font-weight: 800; border-color: #cbd5e1; background: #fff; color: #0f172a; }
.cols { border-left: 0; background: none; }
.col .bar { border-bottom: 0; }
.col .bar i { border-radius: 4px 4px 0 0; background: var(--g600); }
.chain, .coso, .exp, .prompts button, .recon div { border-radius: 12px; }
.chain header { border-radius: 12px 12px 0 0; }
.chat { border-radius: 16px; }
.msg.user { border-radius: 14px; background: var(--g800); color: #fff; }
.msg.assistant { border-radius: 14px; border-left: 1px solid var(--line-2); }
.dlg { border-radius: 18px; padding: 0 20px 18px; }
.dlg-h { margin: 0 -20px 14px; padding: 14px 20px; background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); }
.dlg-h h3, .dlg-h .icon-btn { color: var(--ink); }
.scrim { background: rgba(4, 38, 28, .5); }
.toast { bottom: 18px; border-radius: 12px; background: var(--g800); color: #fff; border-left: 0; font-weight: 600; }
.toast.bad { background: var(--bad); }
.insights, .people, .todo { border-radius: 12px; overflow: hidden; }

/* ---------- Dashboard exécutif ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--g600); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.kpi span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; }
.kpi b { display: block; font-size: 26px; color: var(--g950); font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
.kpi small { color: var(--ink-3); font-size: 12px; }
.kpi.red { border-left-color: var(--bad); } .kpi.amber { border-left-color: #f59e0b; } .kpi.green { border-left-color: var(--g500); } .kpi.blue { border-left-color: #2a78d6; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.g2w { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.g3 > *, .g2 > *, .g2w > * { min-width: 0; }
.chart-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.donut { width: 170px; max-width: 100%; }
.chart { width: 100%; height: auto; display: block; }
.seg-arc { stroke: var(--surface); stroke-width: 2; }
.gl { stroke: var(--line); }
.svg-v { font-size: 12px; font-weight: 700; fill: var(--ink); }
.svg-in { font-size: 11.5px; font-weight: 700; fill: #fff; }
.svg-s { font-size: 10.5px; fill: var(--ink-3); }
.svg-big { font-size: 26px; font-weight: 800; fill: var(--g950); }
.legend { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.legend li { margin: 5px 0; }

/* ---------- Cours et révision ---------- */
.story { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.story p { margin: 0; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--g500); border-radius: 14px; padding: 12px 14px; font-size: 13px; box-shadow: var(--shadow); }
.story b { display: block; color: var(--g700); margin-bottom: 4px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; counter-reset: f; }
.flow li { counter-increment: f; position: relative; }
.flow li:not(:last-child)::after { content: "→"; position: absolute; right: -8px; top: 34%; color: var(--g600); font-weight: 800; z-index: 1; }
.flow a { display: flex; flex-direction: column; gap: 4px; height: 100%; text-decoration: none; color: var(--ink); background: var(--select); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.flow a:hover { border-color: var(--g500); }
.flow b::before { content: counter(f) ". "; color: var(--g600); }
.flow span { font-size: 12px; color: var(--ink-2); }
h2.sec { font-size: 15px; color: var(--g700); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 10px; }
h2.sec:first-child { margin-top: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.cc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.cc header { display: grid; gap: 4px; }
.cc h3 { font-size: 15.5px; color: var(--g950); }
.cc p { margin: 0; font-size: 13px; color: var(--ink-2); }
.cc .key { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600; }
.cc .proj { background: var(--select); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; color: var(--ink); }
.cc .key b, .cc .proj b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; opacity: .75; }
.cc .lnk { margin-top: auto; align-self: flex-start; }
.memo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.memo div { display: grid; gap: 2px; border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: 12px; padding: 10px 12px; }
.memo span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; }
.memo b { font-size: 16px; color: var(--g950); }
.memo small { font-size: 12.5px; color: var(--ink-2); }
.quiz-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.quiz-top .qb { flex: 1; min-width: 120px; height: 10px; }
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow); min-height: 220px; border-top: 5px solid var(--g500); }
.flash.known { border-top-color: #2a78d6; }
.flash h2 { font-size: 21px; color: var(--g950); margin: 6px 0 16px; line-height: 1.35; }
.flash .ans { background: var(--select); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin-bottom: 4px; }
details.exo { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
details.exo summary { cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
details.exo summary::-webkit-details-marker { display: none; }
details.exo summary::before { content: "▸"; color: var(--g600); }
details.exo[open] summary::before { content: "▾"; }
details.exo ul { margin: 8px 0 4px; padding-left: 20px; font-size: 13px; }
details.exo li { margin: 4px 0; }
.domino { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.domino li { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; }
.domino li:not(:last-child)::after { content: "→"; margin-left: 6px; color: var(--bad); font-weight: 800; }
.aeec { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.aeec div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; }
.aeec b { color: var(--g700); }
.aeec span { font-size: 12.5px; color: var(--ink-2); }

  :root:not([data-theme="light"]) .cc h3, :root:not([data-theme="light"]) .memo b, :root:not([data-theme="light"]) .flash h2 { color: var(--ink); }
  :root:not([data-theme="light"]) .cc .key { background: #3a2c0d; border-color: #5c4512; color: #fde68a; }
}

:root[data-theme="dark"] .cc .key { background: #3a2c0d; border-color: #5c4512; color: #fde68a; }
@media (max-width: 1100px) { .story { grid-template-columns: repeat(2, minmax(0, 1fr)); } .flow { grid-template-columns: repeat(4, minmax(0, 1fr)); } .flow li::after { display: none; } }
@media (max-width: 860px) { .story, .memo, .aeec { grid-template-columns: 1fr; } .flow { grid-template-columns: 1fr 1fr; } .flash { padding: 18px; } .flash h2 { font-size: 18px; } }
.cc header .tag { justify-self: start; }
.tw .lnk { white-space: nowrap; margin-top: 0; }
.seg button.on { background: var(--g800); color: #fff; }

<script>"use strict";(()=>{var Ke={risks:[{id:"R01",title:"Octroi sur dossier incomplet ou incohérent",category:"Crédit",event:"Un crédit est autorisé et décaissé alors que des pièces obligatoires manquent ou que les informations du dossier se contredisent (identité, activité, revenus, garanties).",causes:"Directes : pièces incomplètes (fait du cas) ; informations incohérentes (fait du cas). Indirectes : pression sur les délais ; absence de liste de pièces obligatoires opposable (hypothèse à vérifier).",consequences:"Pertes sur créances ; impossibilité de mobiliser des garanties ; difficulté de recouvrement ; observations de l'audit ou du superviseur ; atteinte à la réputation.",probability:5,gravity:3,justification:"P=5 : le défaut de complétude figure parmi les faits du cas, il est donc déjà observé. G=3 : impact limité par dossier mais cumulatif ; il devient plus lourd si les dossiers concernés sont de montant élevé (à vérifier).",owner:"Directeur des risques (contrôle) ; Directeur commercial (constitution)",control_ids:"C01, C04",coso_principles:"P10, P12, P13",basis:"Constat",recommendation:"Checklist obligatoire des pièces ; blocage du dossier tant qu'une pièce obligatoire manque ; conservation de la preuve du contrôle (C01)."},{id:"R02",title:"Décisions d'octroi selon des critères non harmonisés",category:"Crédit",event:"Des dossiers comparables reçoivent des décisions différentes selon le décideur ou l'agence, sans grille commune d'acceptation.",causes:"Directes : critères non harmonisés (fait du cas). Indirectes : politique de crédit non formalisée ou non diffusée ; absence de comité de crédit structuré (hypothèse à vérifier).",consequences:"Sélection adverse ; portefeuille hétérogène et difficile à piloter ; contestations de clients ; impossibilité d'expliquer une décision à l'audit.",probability:4,gravity:3,justification:"P=4 : l'hétérogénéité est un fait du cas, mais sa fréquence exacte est inconnue. G=3 : effet progressif sur la qualité du portefeuille, sans choc immédiat.",owner:"Directeur général (politique) ; Directeur des risques (grille d'analyse)",control_ids:"C02, C06",coso_principles:"P7, P10, P12",basis:"Constat",recommendation:"Grille d'analyse commune et critères documentés ; revue indépendante des décisions dérogatoires (C02, C06)."},{id:"R03",title:"Dégradation du portefeuille sous pression des volumes",category:"Crédit",event:"Des objectifs de production fondés sur le volume conduisent à accepter des dossiers plus risqués ; la qualité du portefeuille se dégrade avec un décalage dans le temps.",causes:"Directes : objectifs de volumes en tension avec la qualité (fait du cas). Indirectes : rémunération ou évaluation des commerciaux sans composante qualité (hypothèse à vérifier) ; croissance sans suivi de la répartition des expositions (hypothèse à vérifier) ; arbitrage direction non formalisé.",consequences:"Hausse des impayés à moyen terme ; provisions et pertes ; tension sur la rentabilité ; effet de levier négatif sur la croissance recherchée.",probability:4,gravity:5,justification:"P=4 : la tension volume/qualité est un fait du cas et les incitations jouent dans le sens du volume. G=5 : atteinte potentielle à la viabilité de la stratégie de croissance et à la liquidité par effet de cascade.",owner:"Directeur général",control_ids:"C02, C03, C06, C07",coso_principles:"P5, P6",basis:"Constat",recommendation:"Intégrer un critère de qualité aux objectifs commerciaux ; revue trimestrielle ; suivi de la concentration (C06, C07)."},{id:"R04",title:"Retards de remboursement détectés tardivement",category:"Crédit",event:"Des échéances impayées ne sont pas repérées ou escaladées à temps ; le traitement amiable intervient trop tard.",causes:"Directes : suivi des anomalies insuffisamment formalisé (fait du cas), pouvant retarder la détection des échéances impayées. Indirectes : absence de calendrier d'alertes ; responsabilités de relance mal réparties (hypothèses à vérifier).",consequences:"Hausse des créances en souffrance ; coûts de recouvrement ; moindre efficacité des garanties ; tension de trésorerie.",probability:3,gravity:3,justification:"P=3 : le cas établit un suivi des anomalies insuffisamment formalisé, indice indirect de faiblesse du suivi, sans préciser que des retards ont déjà été détectés tardivement. G=3 : impact croissant avec la durée du retard.",owner:"Directeur financier",control_ids:"C05",coso_principles:"P13, P14, P16, P17",basis:"Hypothèse",recommendation:"État périodique des échéances et retards ; chaque alerte attribuée à un responsable et suivie jusqu'à résolution (C05)."},{id:"R05",title:"Tension de trésorerie liée à l'accélération des décaissements",category:"Liquidité",event:"La cadence des décaissements dépasse les encaissements et les ressources disponibles, sans anticipation par la fonction finance.",causes:"Directes : volonté d'accélérer les décisions pour augmenter les volumes (fait du cas). Indirectes : absence de lien entre plan de production et plan de trésorerie (hypothèse à vérifier).",consequences:"Recours à des financements d'urgence plus coûteux ; report ou gel de décaissements ; dégradation de la relation client ; image de fragilité.",probability:3,gravity:4,justification:"P=3 : la croissance recherchée accroît l'exposition mais aucune donnée de trésorerie n'est fournie. G=4 : une rupture de liquidité affecte l'ensemble de l'activité.",owner:"Directeur financier",control_ids:"C05, C08",coso_principles:"P7, P13, P14",basis:"Hypothèse",recommendation:"Prévision glissante de trésorerie ; seuil d'escalade interne validé par la direction après analyse des flux (C05, C08)."},{id:"R06",title:"Inadéquation entre échéances des crédits et ressources",category:"Liquidité",event:"Les crédits accordés ont des échéances plus longues que les ressources mobilisées, créant un besoin de refinancement récurrent.",causes:"Directes : développement du financement sans cadrage des ressources (hypothèse à vérifier). Indirectes : concentration des sources de refinancement (hypothèse à vérifier).",consequences:"Dépendance à un nombre limité de financeurs ; coût de refinancement accru ; contrainte sur la capacité de croissance.",probability:2,gravity:5,justification:"P=2 : situation non établie par le cas, retenue comme risque structurel de la croissance. G=5 : une impasse de refinancement pourrait interrompre l'activité.",owner:"Directeur financier ; Direction générale",control_ids:"C05",coso_principles:"P7, P13, P14",basis:"Hypothèse",recommendation:"Tableau périodique des échéances des crédits et des ressources mobilisées ; identification des écarts de maturité et des sources de refinancement concentrées ; écarts significatifs soumis à la direction (C05)."},{id:"R07",title:"Décision hors délégation ou contournement du circuit d'autorisation",category:"Opérationnel",event:"Un crédit est autorisé par une personne ou une instance non habilitée, ou le même collaborateur constitue, analyse et valide un dossier.",causes:"Directes : responsabilités d'autorisation imprécises (fait du cas). Indirectes : absence de matrice de délégation signée ; conflit d'intérêts lié aux objectifs commerciaux.",consequences:"Décisions non opposables ; exposition à la fraude interne ; anomalies relevées par l'audit ; responsabilité des dirigeants engagée.",probability:4,gravity:4,justification:"P=4 : l'imprécision des responsabilités est un fait du cas. G=4 : le contournement atteint à la fois le risque de crédit, la conformité et la réputation.",owner:"Directeur général (délégations) ; Directeur des risques (contrôle)",control_ids:"C02, C03",coso_principles:"P3, P5",basis:"Constat",recommendation:"Matrice des délégations signée ; contrôle de l'habilitation avant validation ; interdiction de décaisser sans décision valide (C02, C03)."},{id:"R08",title:"Anomalies non remontées et données du dossier de mauvaise qualité",category:"Opérationnel",event:"Des anomalies relevées sur les dossiers ne sont ni tracées ni escaladées ; les mêmes erreurs se répètent.",causes:"Directes : suivi des anomalies insuffisamment formalisé et informations incohérentes (faits du cas). Indirectes : absence d'outil de registre ; absence de culture de remontée (hypothèse à vérifier).",consequences:"Impossibilité de mesurer les dérives ; décisions de direction fondées sur des données peu fiables ; réponses tardives aux alertes.",probability:4,gravity:3,justification:"P=4 : la formalisation insuffisante est un fait du cas. G=3 : pas de perte directe, mais effet multiplicateur sur les autres risques.",owner:"Directeur des risques",control_ids:"C01, C04, C08",coso_principles:"P13, P16, P17",basis:"Constat",recommendation:"Registre central des anomalies avec cause, criticité, responsable, échéance, preuve et validation de clôture ; contrôle du reporting avant diffusion (C04, C08)."}],controls:[{id:"C01",name:"Contrôle de complétude des dossiers",nature:"Préventif",objective:"Empêcher qu'un dossier incomplet ou incohérent n'atteigne la décision.",risk_ids:"R01, R08",procedure:"Liste de pièces obligatoires par type de crédit. Le chargé d'affaires coche la liste ; un analyste de la fonction risques, distinct, vérifie les pièces et la cohérence des données avant l'analyse de risque. Le dossier incomplet est retourné avec motif.",owner:"Analyste de la fonction risques",supervision:"Directeur des risques",frequency:"À chaque dossier, avant l'avis de risque",evidence:"Liste de contrôle signée et datée ; motif de retour tracé.",indicator:"Part des dossiers complets à la première présentation (cible à fixer par la direction) ; nombre de retours par motif.",anomaly_treatment:"Retour du dossier ; inscription au registre des anomalies (C04) ; escalade au Directeur commercial si répétition.",status:"En déploiement"},{id:"C02",name:"Double validation des décisions de crédit",nature:"Préventif",objective:"Éviter une décision prise par une seule personne et garantir le respect des délégations.",risk_ids:"R02, R03, R07",procedure:"Toute décision requiert deux validations indépendantes selon la matrice de délégation : avis de la fonction risques, puis autorisation par l'instance délégataire (direction ou comité de crédit). Un avis défavorable des risques impose un niveau supérieur et une motivation écrite.",owner:"Instance délégataire (direction générale ou comité de crédit)",supervision:"Directeur général",frequency:"À chaque décision",evidence:"Procès-verbal ou fiche de décision signée avec avis risques joint.",indicator:"Part des décisions conformes à la délégation ; nombre d'avis défavorables outrepassés.",anomaly_treatment:"Décision suspendue ; décaissement bloqué ; remontée à la direction générale.",status:"À concevoir"},{id:"C03",name:"Séparation des fonctions commerciales, de risques et d'autorisation",nature:"Préventif",objective:"Empêcher qu'un même collaborateur constitue, analyse et autorise un crédit.",risk_ids:"R03, R07",procedure:"Droits d'accès à l'outil de gestion des dossiers définis par rôle selon la matrice RACI. Le chargé d'affaires n'a pas de droit d'avis ni d'autorisation. Revue semestrielle des droits d'accès.",owner:"Direction générale (attribution des rôles) ; Contrôle interne (revue)",supervision:"Directeur général",frequency:"À l'attribution des droits ; revue semestrielle",evidence:"Tableau des droits par rôle ; compte rendu de revue des droits.",indicator:"Nombre de cumuls de rôles détectés lors de la revue.",anomaly_treatment:"Retrait immédiat des droits cumulés ; analyse des décisions concernées ; rapport à la direction.",status:"En déploiement"},{id:"C04",name:"Suivi des anomalies et des dérogations",nature:"Détectif et correctif",objective:"Tracer chaque anomalie et chaque dérogation, et en assurer la correction.",risk_ids:"R01, R08",procedure:"Registre unique des anomalies et dérogations (date, dossier, nature, auteur, motif, décision, échéance de régularisation). Toute dérogation est motivée et validée au niveau de la délégation. Point mensuel de revue du registre par la fonction risques.",owner:"Fonction risques (tenue du registre)",supervision:"Directeur général",frequency:"Tenue continue ; revue mensuelle",evidence:"Registre à jour ; compte rendu de la revue mensuelle.",indicator:"Anomalies ouvertes par ancienneté ; part de dérogations régularisées dans le délai.",anomaly_treatment:"Escalade à la direction générale au-delà du délai fixé ; plan d'action avec responsable.",status:"Opérationnel"},{id:"C05",name:"Surveillance des retards et de la liquidité",nature:"Détectif",objective:"Repérer tôt les impayés et les tensions de trésorerie.",risk_ids:"R04, R05, R06",procedure:"La fonction finance produit un état des échéances impayées par ancienneté et un plan de trésorerie prévisionnel confronté au calendrier des décaissements. Un seuil d'alerte qualitatif est défini dans la charte ; son dépassement déclenche une revue de la direction.",owner:"Fonction finance",supervision:"Directeur général",frequency:"Hebdomadaire pour les retards ; mensuelle pour la liquidité",evidence:"État des retards daté ; plan de trésorerie validé.",indicator:"Dossiers en retard par tranche d'ancienneté ; adéquation décaissements prévus / ressources.",anomaly_treatment:"Alerte à la direction ; ajustement ou gel des décaissements ; relance renforcée.",status:"À concevoir"},{id:"C06",name:"Revue périodique de la qualité du portefeuille",nature:"Détectif et correctif",objective:"Vérifier que la croissance ne se fait pas au détriment de la qualité du portefeuille.",risk_ids:"R02, R03",procedure:"Chaque trimestre, la fonction risques présente à la direction l'évolution de la qualité par segment, l'origine des dossiers dérogatoires et le respect de la charte. La direction arbitre entre croissance et prudence et le consigne.",owner:"Fonction risques",supervision:"Direction générale",frequency:"Trimestrielle",evidence:"Rapport trimestriel ; procès-verbal d'arbitrage.",indicator:"Indicateurs qualitatifs de la charte ; respect des délégations ; ancienneté des anomalies.",ano
